<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Control Refresh</title>
</head>
<body>
<div id="status">Запуск обновления…</div>
<script>
const PUBLIC_REFRESH_TOKEN='__PUBLIC_REFRESH_TOKEN__';
const OWNER='Alex19011901';
const REPO='lead-control-pages';
const WORKFLOW='price-control-public.yml';
const REF='main';

function report(status, detail){
  document.getElementById('status').textContent = status === 'dispatched' ? 'Обновление запущено' : 'Ошибка запуска';
  try { parent.postMessage({source:'price-control-refresh',status:status,detail:detail||'',at:new Date().toISOString()}, '*'); } catch(e) {}
}
(async function(){
  try {
    const res = await fetch('https://api.github.com/repos/'+OWNER+'/'+REPO+'/actions/workflows/'+encodeURIComponent(WORKFLOW)+'/dispatches', {
      method:'POST',
      headers:{
        'Authorization':'Bearer '+PUBLIC_REFRESH_TOKEN,
        'Accept':'application/vnd.github+json',
        'X-GitHub-Api-Version':'2022-11-28',
        'Content-Type':'application/json'
      },
      body:JSON.stringify({ref:REF}),
      cache:'no-store'
    });
    if(!res.ok) throw new Error('github_'+res.status);
    report('dispatched');
  } catch(e) {
    report('error', String(e && (e.message||e) || 'unknown'));
  }
})();
</script>
</body>
</html>
