<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Control Refresh</title>
</head>
<body>
<div id="status">Подготовка обновления…</div>
<script>
const PUBLIC_REFRESH_TOKEN='__PUBLIC_REFRESH_TOKEN__';
const OWNER='Alex19011901';
const REPO='lead-control-pages';
const WORKFLOW='price-control-public.yml';
const REF='main';
const API='https://api.github.com/repos/'+OWNER+'/'+REPO;
const TIMEOUT_MS=20*60*1000;

function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function report(status, detail, payload){
  const labels={
    dispatched:'Workflow запущен…',
    running:'Workflow выполняется…',
    saving:'Получение новых данных…',
    completed:'Обновление завершено',
    error:'Ошибка обновления'
  };
  document.getElementById('status').textContent=labels[status]||status;
  try{
    parent.postMessage({
      source:'price-control-refresh',
      status:status,
      detail:detail||'',
      payload:payload||null,
      at:new Date().toISOString()
    },'*');
  }catch(e){}
}
async function gh(path, options){
  options=options||{};
  options.headers=Object.assign({
    'Authorization':'Bearer '+PUBLIC_REFRESH_TOKEN,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  },options.headers||{});
  options.cache='no-store';
  const res=await fetch(API+path,options);
  if(!res.ok)throw new Error('github_'+res.status);
  return res.status===204?null:res.json();
}
function decodeFile(file){
  const bin=atob(String(file.content||'').replace(/\s/g,''));
  const bytes=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder('utf-8').decode(bytes));
}
async function readCurrent(){
  const f=await gh('/contents/price-control/current.json?ref='+encodeURIComponent(REF)+'&cb='+Date.now());
  return decodeFile(f);
}
async function listRuns(){
  const d=await gh('/actions/workflows/'+encodeURIComponent(WORKFLOW)+'/runs?branch='+encodeURIComponent(REF)+'&event=workflow_dispatch&per_page=20&cb='+Date.now());
  return d.workflow_runs||[];
}
(async function(){
  const deadline=Date.now()+TIMEOUT_MS;
  try{
    const beforePayload=await readCurrent();
    const beforeGeneratedAt=String(beforePayload.generatedAt||'');
    const beforeRuns=await listRuns();
    const oldIds=new Set(beforeRuns.map(r=>String(r.id)));
    const startedAt=Date.now();

    await gh('/actions/workflows/'+encodeURIComponent(WORKFLOW)+'/dispatches',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ref:REF})
    });
    report('dispatched');

    let run=null;
    while(Date.now()<deadline && !run){
      const runs=await listRuns();
      run=runs.find(r=>!oldIds.has(String(r.id)) && Date.parse(r.created_at||0)>=startedAt-60000) || null;
      if(!run)await sleep(3000);
    }
    if(!run)throw new Error('workflow_run_not_found');

    while(Date.now()<deadline){
      const runs=await listRuns();
      const fresh=runs.find(r=>String(r.id)===String(run.id));
      if(fresh)run=fresh;
      if(run.status==='completed'){
        if(run.conclusion!=='success')throw new Error('workflow_'+String(run.conclusion||'failed'));
        break;
      }
      report('running',String(run.id));
      await sleep(4000);
    }
    if(run.status!=='completed')throw new Error('workflow_timeout');

    report('saving',String(run.id));
    let payload=null;
    while(Date.now()<deadline){
      payload=await readCurrent();
      const nowGeneratedAt=String(payload.generatedAt||'');
      if(nowGeneratedAt && nowGeneratedAt!==beforeGeneratedAt)break;
      await sleep(3000);
    }
    if(!payload || String(payload.generatedAt||'')===beforeGeneratedAt)throw new Error('data_not_updated');

    report('completed',String(run.id),payload);
  }catch(e){
    report('error',String(e&&e.message||e||'unknown'));
  }
})();
</script>
</body>
</html>
