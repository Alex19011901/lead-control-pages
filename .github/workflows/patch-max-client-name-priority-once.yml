name: Patch MAX client-name priority once

on:
  push:
    paths:
      - ".github/workflows/patch-max-client-name-priority-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply parser patch
        run: python app/scripts/patch_max_client_name_priority_once.py

      - name: Run regression test
        working-directory: app
        run: PYTHONPATH=src python -m unittest tests.test_max_client_name_priority -v

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/lead_control/parsers/max_leads.py app/tests/test_max_client_name_priority.py
          git commit -m "Prefer client names beside MAX phones"
          git pull --rebase --autostash origin main
          git push origin main
