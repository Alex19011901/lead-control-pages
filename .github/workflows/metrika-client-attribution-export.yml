name: Metrika Client Attribution Export

on:
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"
  push:
    paths:
      - ".github/workflows/metrika-client-attribution-export.yml"
      - "app/scripts/metrika_client_attribution_export.py"
      - "app/tests/test_metrika_client_attribution_export.py"

permissions:
  contents: write

concurrency:
  group: metrika-client-attribution-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test Metrika attribution export
        working-directory: app
        run: python -m unittest tests.test_metrika_logs_readonly tests.test_metrika_client_attribution_export -v

      - name: Export previous-day Metrika attribution map
        env:
          YANDEX_METRIKA_READ_TOKEN: ${{ secrets.YANDEX_METRIKA_READ_TOKEN }}
        run: python app/scripts/metrika_client_attribution_export.py --counter-id 112267492 --output runtime-data/metrika_attribution_map.json --poll-seconds 2 --max-polls 60

      - name: Save safe attribution map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-data/metrika_attribution_map.json
          if git diff --cached --quiet; then
            echo "No Metrika attribution changes"
          else
            git commit -m "Refresh Metrika attribution map"
            git pull --rebase --autostash origin main
            git push origin main
          fi
