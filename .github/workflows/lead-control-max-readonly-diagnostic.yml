name: Lead Control MAX read-only incident diagnostic

on:
  push:
    paths:
      - '.github/workflows/lead-control-max-readonly-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: lead-control-max-diagnostic
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check MAX bot status, role, subscription and recent chat activity (no payload logging)
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: '-71704692523093'
        run: |
          python - <<'PY'
          import os,ssl,json,urllib.request,urllib.error,urllib.parse,datetime,re,collections
          token=os.environ['MAX_BOT_TOKEN']
          chat_id=os.environ['MAX_CHAT_ID']
          ca='app/certs/max_ca_bundle.pem'
          context=ssl.create_default_context(cafile=ca)
          if hasattr(ssl,'VERIFY_X509_PARTIAL_CHAIN'):
              context.verify_flags |= ssl.VERIFY_X509_PARTIAL_CHAIN
          base='https://platform-api2.max.ru'
          def get(path,params=None):
              url=base+path+('?' + urllib.parse.urlencode(params) if params else '')
              req=urllib.request.Request(url,headers={'Authorization':token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,timeout=25,context=context) as response:
                      return json.loads(response.read().decode('utf-8')),'200'
              except urllib.error.HTTPError as exc:
                  return None,str(exc.code)
              except Exception as exc:
                  return None,type(exc).__name__
          me,code=get('/me')
          print('BOT_AUTH_HTTP',code)
          if me and isinstance(me,dict):
              print('BOT_ID_PRESENT',bool(me.get('user_id')))
          sub,code=get('/subscriptions')
          print('SUBSCRIPTIONS_HTTP',code)
          if sub is not None:
              items=(sub.get('subscriptions',[]) if isinstance(sub,dict) else sub)
              if not isinstance(items,list): items=[]
              print('WEBHOOK_SUBSCRIPTIONS_COUNT',len(items))
              for i,item in enumerate(items[:4],1):
                  types=item.get('update_types') or item.get('updates') or []
                  print('WEBHOOK_ENTRY',i,'TYPES',','.join(str(t) for t in types) if isinstance(types,list) else 'unknown')
          mem,code=get('/chats/'+urllib.parse.quote(chat_id)+'/members/me')
          print('GROUP_MEMBERSHIP_HTTP',code)
          if isinstance(mem,dict):
              print('GROUP_IS_ADMIN',bool(mem.get('is_admin') or mem.get('is_owner')))
              print('GROUP_HAS_READ_ALL_MESSAGES', 'read_all_messages' in (mem.get('permissions') or []))
              print('GROUP_PERMISSIONS_COUNT',len(mem.get('permissions') or []))
          chat,code=get('/chats/'+urllib.parse.quote(chat_id))
          print('GROUP_DETAILS_HTTP',code)
          messages,code=get('/messages',{'chat_id':chat_id,'count':100})
          print('GROUP_MESSAGES_HTTP',code)
          if isinstance(messages,dict):
              rows=messages.get('messages') or []
              print('GROUP_MESSAGES_RETURNED',len(rows))
              cutoff_ms=int(datetime.datetime(2026,10,24,0,0,tzinfo=datetime.timezone.utc).timestamp()*1000)
              last_ts=0
              days=collections.Counter()
              recent=0
              leadlike=0
              for m in rows:
                  if not isinstance(m,dict): continue
                  ms=int(m.get('timestamp') or 0)
                  if ms and ms<1e11:ms*=1000
                  if ms:
                      last_ts=max(last_ts,ms)
                      days[datetime.datetime.fromtimestamp(ms/1000,datetime.timezone.utc).strftime('%Y-%m-%d')]+=1
                  if ms>=cutoff_ms:
                      recent+=1
                      body=m.get('body') or {}
                      txt=str(body.get('text') or '')
                      if re.search(r'заявк|request details|phone:',txt,re.I):
                          leadlike+=1
              print('GROUP_LAST_MESSAGE_UTC',datetime.datetime.fromtimestamp(last_ts/1000,datetime.timezone.utc).isoformat() if last_ts else 'none')
              print('GROUP_MESSAGE_DATES_UTC',json.dumps(dict(sorted(days.items())),ensure_ascii=False))
              print('GROUP_MESSAGES_SINCE_OCT24',recent)
              print('GROUP_LEADLIKE_MESSAGES_SINCE_OCT24',leadlike)
          PY

      - name: Compare saved marker with filtered and unfiltered MAX event responses (do not persist marker)
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,ssl,urllib.parse,urllib.request,urllib.error,collections
          ctx=ssl.create_default_context(cafile='app/certs/max_ca_bundle.pem')
          if hasattr(ssl,'VERIFY_X509_PARTIAL_CHAIN'):
              ctx.verify_flags |= ssl.VERIFY_X509_PARTIAL_CHAIN
          token=os.environ['MAX_BOT_TOKEN']
          def poll(types):
              p={'marker':727668,'limit':100,'timeout':0}
              if types: p['types']=types
              u='https://platform-api2.max.ru/updates?'+urllib.parse.urlencode(p)
              req=urllib.request.Request(u,headers={'Authorization':token,'Accept':'application/json'})
              try:
                  with urllib.request.urlopen(req,context=ctx,timeout=25) as resp:
                      data=json.loads(resp.read().decode('utf-8'))
                  updates=data.get('updates') or []
                  print('READONLY_UPDATES_WITH_FILTER_HTTP' if types else 'READONLY_UPDATES_ALL_TYPES_HTTP','200')
                  print('EVENT_COUNT_FILTERED' if types else 'EVENT_COUNT_ALL_TYPES',len(updates))
                  print('RESPONSE_MARKER_FILTERED' if types else 'RESPONSE_MARKER_ALL_TYPES',data.get('marker'))
                  print('RETURNED_EVENT_TYPES_FILTERED' if types else 'RETURNED_EVENT_TYPES_ALL',dict(collections.Counter(str(u.get('update_type') or '?') for u in updates if isinstance(u,dict))))
              except urllib.error.HTTPError as exc:
                  print('READONLY_UPDATES_WITH_FILTER_HTTP' if types else 'READONLY_UPDATES_ALL_TYPES_HTTP',exc.code)
              except Exception as exc:
                  print('READONLY_UPDATES_WITH_FILTER_HTTP' if types else 'READONLY_UPDATES_ALL_TYPES_HTTP',type(exc).__name__)
          poll('bot_added,message_created,message_edited')
          poll(None)
          PY

      - name: Count unseen MAX messages and classifications without exposing customer details
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MAX_CHAT_ID: '-71704692523093'
        run: |
          PYTHONPATH=app/src python - <<'PY'
          import os,json,ssl,urllib.parse,urllib.request,urllib.error,collections,datetime
          from pathlib import Path
          from lead_control.parsers.max_leads import classify_max_event, LEAD_CATEGORIES
          ctx=ssl.create_default_context(cafile='app/certs/max_ca_bundle.pem')
          if hasattr(ssl,'VERIFY_X509_PARTIAL_CHAIN'):
              ctx.verify_flags |= ssl.VERIFY_X509_PARTIAL_CHAIN
          chat_id=int(os.environ['MAX_CHAT_ID'])
          token=os.environ['MAX_BOT_TOKEN']
          url='https://platform-api2.max.ru/messages?'+urllib.parse.urlencode({'chat_id':chat_id,'count':100})
          req=urllib.request.Request(url,headers={'Authorization':token,'Accept':'application/json'})
          with urllib.request.urlopen(req,context=ctx,timeout=25) as r:
              rows=json.loads(r.read().decode('utf-8')).get('messages') or []
          events=[json.loads(line) for line in Path('runtime-data/events.ndjson').read_text(encoding='utf-8').splitlines() if line.strip()]
          known={str(e.get('message_id')) for e in events if e.get('type')=='max_message_created' and e.get('chat_id')==chat_id}
          missing=[]
          missing_id=0
          for row in rows:
              body=row.get('body') or {}
              mid=str(body.get('mid') or '')
              if not mid: missing_id+=1;continue
              if mid not in known:missing.append(row)
          classes=collections.Counter()
          byday=collections.Counter()
          latest=0
          for m in missing:
              body=m.get('body') or {}
              sender=m.get('sender') or {}
              attachments=m.get('attachments') or body.get('attachments') or []
              linked=m.get('linked_message') or m.get('forwarded_message') or body.get('linked_message') or {}
              evt={'source':'MAX','type':'max_message_created','chat_id':chat_id,'message_id':body.get('mid'),'text':body.get('text') or '',
                   'timestamp':m.get('timestamp'), 'sender_user_id':sender.get('user_id'), 'sender_name':sender.get('name'),
                   'sender_username':sender.get('username'),'attachments':attachments,'has_attachments':bool(attachments),
                   'has_linked_or_forwarded_message':bool(linked),
                   'linked_or_forwarded_text':(linked.get('body') or {}).get('text') or linked.get('text') or ''}
              cls=classify_max_event(evt)
              classes[str(cls.get('classification') or '?')]+=1
              ms=int(m.get('timestamp') or 0)
              if ms<1e11:ms*=1000
              latest=max(latest,ms)
              if ms:byday[datetime.datetime.fromtimestamp(ms/1000,datetime.timezone.utc).strftime('%Y-%m-%d')]+=1
          print('UNSEEN_CHAT_MESSAGES',len(missing))
          print('UNSEEN_MESSAGES_WITHOUT_IDS',missing_id)
          print('UNSEEN_CLASSIFICATION_COUNTS',json.dumps(dict(sorted(classes.items())),ensure_ascii=False))
          print('UNSEEN_AUTOMATIC_LEAD_COUNT',sum(classes[k] for k in LEAD_CATEGORIES))
          print('UNSEEN_DATES_UTC',json.dumps(dict(sorted(byday.items()))))
          print('UNSEEN_LAST_TIMESTAMP_UTC',datetime.datetime.fromtimestamp(latest/1000,datetime.timezone.utc).isoformat() if latest else 'none')
          PY
