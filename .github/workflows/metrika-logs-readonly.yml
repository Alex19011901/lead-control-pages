name: Metrika Logs Read-Only Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test isolated collector
        working-directory: app
        run: python -m unittest tests.test_metrika_logs_readonly -v

      - name: Run isolated Metrika Logs export diagnostic
        env:
          YANDEX_METRIKA_READ_TOKEN: ${{ secrets.YANDEX_METRIKA_READ_TOKEN }}
        run: >-
          python app/scripts/metrika_logs_readonly.py
          --counter-id 112267492
          --yclid 5288069203188252671
          --date1 2026-09-03
          --date2 2026-09-03
          --poll-seconds 2
          --max-polls 60
