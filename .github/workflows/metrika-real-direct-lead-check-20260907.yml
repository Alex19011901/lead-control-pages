name: One-off Real Direct Lead Check 2026-09-07

on:
  push:
    paths:
      - ".github/workflows/metrika-real-direct-lead-check-20260907.yml"

permissions:
  contents: read

concurrency:
  group: metrika-real-direct-lead-check-20260907
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify read-only client allow-list
        working-directory: app
        run: PYTHONPATH=. python -m unittest tests.test_metrika_logs_readonly -v

      - name: Match real Yandex Direct leads to Metrika visits and submit hits
        working-directory: app
        env:
          YANDEX_METRIKA_READ_TOKEN: ${{ secrets.YANDEX_METRIKA_READ_TOKEN }}
        run: |
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations

          import datetime as dt
          import hashlib
          import json
          import os
          import re
          import time
          import urllib.parse
          from pathlib import Path

          from scripts.metrika_logs_readonly import LogsApiError, MetrikaLogsReadOnlyClient, parse_tsv

          COUNTER_ID = 52597240
          DATE = "2026-09-07"
          ATTRIBUTION = "AUTOMATIC"
          TZ = dt.timezone(dt.timedelta(hours=3))
          TERMINAL_FAILURES = {
              "canceled",
              "cleaned_by_user",
              "cleaned_automatically_as_too_old",
              "processing_failed",
          }
          VISIT_FIELDS = (
              "ym:s:visitID",
              "ym:s:dateTimeUTC",
              "ym:s:visitDuration",
              "ym:s:clientID",
              "ym:s:startURL",
              "ym:s:automaticTrafficSource",
              "ym:s:automaticAdvEngine",
              "ym:s:automaticDirectClickOrder",
              "ym:s:automaticDirectBannerGroup",
              "ym:s:automaticDirectClickBanner",
              "ym:s:automaticDirectClickOrderName",
              "ym:s:automaticClickBannerGroupName",
              "ym:s:automaticDirectClickBannerName",
              "ym:s:automaticUTMSource",
              "ym:s:automaticUTMMedium",
              "ym:s:automaticUTMCampaign",
          )
          HIT_FIELDS = (
              "ym:pv:visitID",
              "ym:pv:dateTime",
              "ym:pv:clientID",
              "ym:pv:URL",
          )

          def clean(value: object) -> str:
              return str(value or "").strip()

          def sha(value: object) -> str:
              text = clean(value)
              return hashlib.sha256(text.encode("utf-8")).hexdigest() if text else ""

          def parse_counter_time(value: object) -> dt.datetime | None:
              text = clean(value)
              for fmt in ("%Y-%m-%d %H:%M:%S", "%Y-%m-%dT%H:%M:%S"):
                  try:
                      return dt.datetime.strptime(text, fmt).replace(tzinfo=TZ)
                  except ValueError:
                      pass
              return None

          def parse_duration(value: object) -> int | None:
              try:
                  return max(int(float(clean(value))), 0)
              except (TypeError, ValueError):
                  return None

          def is_complete_direct(row: dict[str, str]) -> bool:
              campaign = clean(row.get("ym:s:automaticDirectClickOrder"))
              group = clean(row.get("ym:s:automaticDirectBannerGroup"))
              ad = clean(row.get("ym:s:automaticDirectClickBanner"))
              return bool(campaign and group and ad and campaign != "0" and group != "0" and ad != "0")

          def contains_lead_time(row: dict[str, str], lead_ts: int) -> bool:
              start = parse_counter_time(row.get("ym:s:dateTimeUTC"))
              duration = parse_duration(row.get("ym:s:visitDuration"))
              if start is None or duration is None:
                  return False
              start_ts = int(start.timestamp())
              return start_ts <= int(lead_ts) <= start_ts + duration

          def safe_path(value: object) -> str:
              try:
                  return urllib.parse.urlsplit(clean(value)).path or "/"
              except Exception:
                  return ""

          def export_rows(client, fields, source):
              client.evaluate(date1=DATE, date2=DATE, fields=fields, attribution=ATTRIBUTION, source=source)
              request = client.create_export(date1=DATE, date2=DATE, fields=fields, attribution=ATTRIBUTION, source=source)
              current = request
              for poll_number in range(241):
                  if current.status == "processed":
                      break
                  if current.status in TERMINAL_FAILURES:
                      raise LogsApiError(f"log_request_{current.status}")
                  if poll_number == 240:
                      raise LogsApiError(f"{source}_log_request_timeout")
                  time.sleep(3)
                  current = client.status(request.request_id)
              rows = []
              for part_number in current.parts:
                  rows.extend(parse_tsv(client.download_part(current.request_id, part_number)))
              return current.request_id, rows

          def safe_reason(exc: Exception) -> str:
              value = f"{type(exc).__name__}:{exc}".replace("\n", " ").replace("\r", " ")
              value = re.sub(r"(OAuth|Bearer)\s+[A-Za-z0-9._~+/=-]+", r"\1 [redacted]", value)
              return value[:240]

          leads_payload = json.loads(Path("../runtime-data/advertising_leads.json").read_text(encoding="utf-8"))
          all_leads = leads_payload.get("leads") if isinstance(leads_payload, dict) else []
          target_leads = []
          for lead in all_leads if isinstance(all_leads, list) else []:
              if not isinstance(lead, dict):
                  continue
              if not clean(lead.get("created_at")).startswith(DATE):
                  continue
              if clean(lead.get("source")) != "САЙТ ТИЛЬДА":
                  continue
              if clean(lead.get("channel")) != "TELEGRAM":
                  continue
              if clean(lead.get("utm_source")).lower() != "yandex_direct":
                  continue
              try:
                  created_ts = int(lead.get("created_ts"))
              except (TypeError, ValueError):
                  continue
              target_leads.append({
                  "lead_id": clean(lead.get("lead_id")),
                  "created_at": clean(lead.get("created_at")),
                  "created_ts": created_ts,
                  "declared_utm_campaign": clean(lead.get("utm_campaign")),
                  "stored_client_id_sha256": clean(lead.get("metrika_client_id_sha256")),
              })

          token = os.environ.get("YANDEX_METRIKA_READ_TOKEN", "").strip()
          if not token:
              print(json.dumps({"status": "blocked", "reason": "missing_read_token"}, sort_keys=True))
              raise SystemExit(2)

          client = MetrikaLogsReadOnlyClient(token, counter_id=COUNTER_ID)
          try:
              visits_request_id, visits = export_rows(client, VISIT_FIELDS, "visits")
          except Exception as exc:
              print(json.dumps({"status": "error", "stage": "visits", "reason": safe_reason(exc)}, sort_keys=True))
              raise SystemExit(1)

          complete_direct_visits = [row for row in visits if is_complete_direct(row)]
          lead_checks = []
          candidate_visit_ids = set()
          candidate_by_lead = {}

          for lead in target_leads:
              candidates = [row for row in complete_direct_visits if contains_lead_time(row, lead["created_ts"])]
              safe_candidates = []
              for row in candidates:
                  visit_id = clean(row.get("ym:s:visitID"))
                  client_id = clean(row.get("ym:s:clientID"))
                  candidate_visit_ids.add(visit_id)
                  safe_candidates.append({
                      "visit_id_sha256": sha(visit_id),
                      "client_id_sha256": sha(client_id),
                      "start_time_utc_plus_3": clean(row.get("ym:s:dateTimeUTC")),
                      "duration_seconds": parse_duration(row.get("ym:s:visitDuration")),
                      "traffic_source": clean(row.get("ym:s:automaticTrafficSource")),
                      "adv_engine": clean(row.get("ym:s:automaticAdvEngine")),
                      "campaign_id": clean(row.get("ym:s:automaticDirectClickOrder")),
                      "group_id": clean(row.get("ym:s:automaticDirectBannerGroup")),
                      "ad_id": clean(row.get("ym:s:automaticDirectClickBanner")),
                      "campaign_name": clean(row.get("ym:s:automaticDirectClickOrderName")),
                      "group_name": clean(row.get("ym:s:automaticClickBannerGroupName")),
                      "ad_name": clean(row.get("ym:s:automaticDirectClickBannerName")),
                      "utm_source": clean(row.get("ym:s:automaticUTMSource")),
                      "utm_medium": clean(row.get("ym:s:automaticUTMMedium")),
                      "utm_campaign": clean(row.get("ym:s:automaticUTMCampaign")),
                      "stored_client_hash_matches": bool(lead["stored_client_id_sha256"] and lead["stored_client_id_sha256"] == sha(client_id)),
                  })
              candidate_by_lead[lead["lead_id"]] = candidates
              lead_checks.append({
                  "lead_id": lead["lead_id"],
                  "created_at": lead["created_at"],
                  "declared_utm_campaign": lead["declared_utm_campaign"],
                  "stored_client_id_present": bool(lead["stored_client_id_sha256"]),
                  "complete_direct_visit_candidates": len(candidates),
                  "candidates": safe_candidates,
              })

          hits_request_id = None
          hits = []
          if candidate_visit_ids:
              try:
                  hits_request_id, hits = export_rows(client, HIT_FIELDS, "hits")
              except Exception as exc:
                  print(json.dumps({
                      "status": "partial",
                      "stage": "hits",
                      "reason": safe_reason(exc),
                      "counter_id": COUNTER_ID,
                      "date": DATE,
                      "attribution": ATTRIBUTION,
                      "target_leads_total": len(target_leads),
                      "complete_direct_visits_total": len(complete_direct_visits),
                      "visits_request_id": visits_request_id,
                      "lead_checks": lead_checks,
                  }, ensure_ascii=False, sort_keys=True))
                  raise SystemExit(4)

          proved = []
          for check in lead_checks:
              lead_id = check["lead_id"]
              raw_candidates = candidate_by_lead.get(lead_id, [])
              if len(raw_candidates) != 1:
                  check["exact_submit_hits"] = 0
                  check["proof_complete"] = False
                  continue
              raw_candidate = raw_candidates[0]
              visit_id = clean(raw_candidate.get("ym:s:visitID"))
              client_id = clean(raw_candidate.get("ym:s:clientID"))
              lead = next(item for item in target_leads if item["lead_id"] == lead_id)
              expected_counter_time = dt.datetime.fromtimestamp(lead["created_ts"], tz=TZ).strftime("%Y-%m-%d %H:%M:%S")
              exact_submit_hits = []
              for hit in hits:
                  if clean(hit.get("ym:pv:visitID")) != visit_id:
                      continue
                  if clean(hit.get("ym:pv:clientID")) != client_id:
                      continue
                  if clean(hit.get("ym:pv:dateTime")) != expected_counter_time:
                      continue
                  path = safe_path(hit.get("ym:pv:URL"))
                  if path.startswith("/tilda/form") and "/submitted/" in path:
                      exact_submit_hits.append({
                          "date_time_counter": clean(hit.get("ym:pv:dateTime")),
                          "path": path,
                      })
              check["exact_submit_hits"] = len(exact_submit_hits)
              check["submit_hits"] = exact_submit_hits[:5]
              check["proof_complete"] = len(exact_submit_hits) == 1
              if check["proof_complete"]:
                  proved.append({
                      "lead_id": lead_id,
                      "client_id_sha256": sha(client_id),
                      "campaign_id": clean(raw_candidate.get("ym:s:automaticDirectClickOrder")),
                      "group_id": clean(raw_candidate.get("ym:s:automaticDirectBannerGroup")),
                      "ad_id": clean(raw_candidate.get("ym:s:automaticDirectClickBanner")),
                      "campaign_name": clean(raw_candidate.get("ym:s:automaticDirectClickOrderName")),
                      "group_name": clean(raw_candidate.get("ym:s:automaticClickBannerGroupName")),
                      "ad_name": clean(raw_candidate.get("ym:s:automaticDirectClickBannerName")),
                  })

          result = {
              "status": "proved" if proved else "not_proved",
              "operation": "read_export_only",
              "counter_id": COUNTER_ID,
              "date": DATE,
              "attribution": ATTRIBUTION,
              "target_leads_total": len(target_leads),
              "visits_rows_total": len(visits),
              "complete_direct_visits_total": len(complete_direct_visits),
              "visits_request_id": visits_request_id,
              "hits_request_id": hits_request_id,
              "hits_rows_total": len(hits),
              "proved_leads_total": len(proved),
              "proved": proved,
              "lead_checks": lead_checks,
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          raise SystemExit(0 if proved else 3)
          PY
