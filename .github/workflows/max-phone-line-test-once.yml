name: MAX Phone Line Test Once

on:
  push:
    paths:
      - ".github/workflows/max-phone-line-test-once.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MAX phone line regression test
        working-directory: app
        run: |
          PYTHONPATH=src python -m unittest             tests.test_max_leads_parser.MaxLeadClassifierTests.test_host_phone_does_not_merge_date_or_guest_lines
