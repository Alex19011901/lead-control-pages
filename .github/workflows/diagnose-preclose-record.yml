name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read message availability without logging private text
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          domain = 'https://alex1901yaru.amocrm.ru'
          token = os.environ['AMOCRM_TOKEN']
          lead_id = 48855703

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)

          def shape(value, depth=0):
              if depth > 5:
                  return type(value).__name__
              if isinstance(value, dict):
                  return {str(k): shape(v, depth + 1) for k, v in list(value.items())[:25]}
              if isinstance(value, list):
                  return [shape(value[0], depth + 1)] if value else []
              return type(value).__name__

          def request(label, path, params):
              url = domain + path + ('?' + urllib.parse.urlencode(params) if params else '')
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'Authorization': 'Bearer ' + token}, method='GET')
              try:
                  with opener.open(req, timeout=25) as res:
                      raw = res.read()
                      try:
                          payload = json.loads(raw) if raw else {}
                      except ValueError:
                          print(json.dumps({'check': label, 'http': res.status, 'json': False}), flush=True)
                          return None
                      print(json.dumps({'check': label, 'http': res.status, 'shape': shape(payload)}, ensure_ascii=False), flush=True)
                      return payload
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'check': label, 'http': exc.code}), flush=True)
                  if exc.code in (400, 404, 405, 301, 302, 303, 307, 308):
                      return None
                  raise SystemExit('Stopped after authorization/rate/server error; no retry')
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit('Stopped after network error; no retry')

          def summarize_notes(label, payload):
              if not isinstance(payload, dict):
                  return
              items = (payload.get('_embedded') or {}).get('notes') or (payload.get('_embedded') or {}).get('items') or []
              records = []
              for item in items:
                  params = item.get('params') or {}
                  text = params.get('text', '') if isinstance(params, dict) else ''
                  text = str(text or item.get('text') or '')
                  records.append({'id': item.get('id'), 'type': item.get('note_type'), 'created_at': item.get('created_at'), 'text_length': len(text), 'text_sha256': hashlib.sha256(text.encode()).hexdigest() if text else None})
              print(json.dumps({'check': label, 'count': len(items), 'records': records[:30]}, ensure_ascii=False), flush=True)

          notes = request('notes_by_entity', '/api/v4/leads/' + str(lead_id) + '/notes', {'limit': 250, 'page': 1})
          summarize_notes('notes_by_entity', notes)
          legacy = request('legacy_notes', '/api/v2/notes', {'type': 'lead', 'element_id': lead_id, 'limit_rows': 100})
          summarize_notes('legacy_notes', legacy)
          request('chat_session_read_access', '/ajax/v1/chats/session', {})
          PY
