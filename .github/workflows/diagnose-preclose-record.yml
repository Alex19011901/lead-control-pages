# rerun-marker: validate-mail-artifact-and-old-leads-20261002
name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run mail and dashboard regressions
        working-directory: app
        run: PYTHONPATH=.:src python -m unittest tests.test_mail_parser tests.test_source_categories tests.test_telegram_needs_review tests.test_dashboard_snapshot tests.test_amocrm_deal_matching -v
      - name: Check old mail leads in amoCRM read only
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          PYTHONPATH=app/src python - <<'PY'
          import json, os
          from lead_control.amocrm_client import AmoCRMClient

          client=AmoCRMClient('https://alex1901yaru.amocrm.ru',os.environ['AMOCRM_TOKEN'])
          targets=[
              ('79636698819',1787581949,'2026-08-24 17:32:29'),
              ('79099171059',1782902955,'2026-07-01 13:49:15'),
          ]
          for phone,target,label in targets:
              direct=client._search_collection('leads',phone,with_value=None)
              contacts=client._search_collection('contacts',phone,with_value='leads')
              candidates=client._flatten_lead_candidates(direct,contacts)
              unique={}
              for c in candidates:
                  unique[int(c['id'])]=c
              rows=[]
              for c in unique.values():
                  rows.append({
                      'id':int(c.get('id') or 0),
                      'created_at':int(c.get('created_at') or 0),
                      'updated_at':int(c.get('updated_at') or 0),
                      'closed_at':int(c.get('closed_at') or 0),
                      'responsible_user_id':c.get('responsible_user_id'),
                  })
              result=client.search(phone,'old-mail-diagnostic','phone',target_created_at=target)
              print('OLD_MAIL_CHECK '+json.dumps({
                  'phone':phone,
                  'source_time':label,
                  'candidate_count':len(rows),
                  'candidates':sorted(rows,key=lambda x:x['created_at']),
                  'selected':result.as_dict(),
              },ensure_ascii=False),flush=True)
          PY
