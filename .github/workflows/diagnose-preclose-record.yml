name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read real amoCRM timeline text
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error

          token=os.environ['AMOCRM_TOKEN']
          base='https://alex1901yaru.amocrm.ru'
          targets=[
              (48813485,1790580620),
              (48855703,1790579990),
          ]

          def find_text(v):
              if isinstance(v,str):
                  return v.strip()
              if isinstance(v,list):
                  for x in v:
                      t=find_text(x)
                      if t:
                          return t
                  return ''
              if isinstance(v,dict):
                  for k in ('text','message','body','comment','result','value'):
                      if k in v:
                          t=find_text(v[k])
                          if t:
                              return t
              return ''

          for lead_id,closed_at in targets:
              url=f'{base}/ajax/v3/leads/{lead_id}/timeline'
              req=urllib.request.Request(url,headers={
                  'Authorization':'Bearer '+token,
                  'Accept':'application/json,text/plain,*/*',
                  'User-Agent':'Mozilla/5.0',
                  'Referer':f'{base}/leads/detail/{lead_id}',
                  'X-Requested-With':'XMLHttpRequest',
              },method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      raw=r.read().decode('utf-8','ignore')
                      payload=json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print(json.dumps({'lead_id':lead_id,'http':e.code}),flush=True)
                  continue

              items=(payload.get('_embedded') or {}).get('items') or []
              rows=[]
              for x in items:
                  if not isinstance(x,dict):
                      continue
                  ts=int(x.get('date_create') or 0)
                  mts=int(x.get('msec_created_at') or 0)
                  # msec_created_at can be seconds or milliseconds depending on item type.
                  event_ts=(mts//1000 if mts>10_000_000_000 else mts) or ts
                  text=find_text(x.get('data')) or find_text(x.get('params'))
                  rows.append({
                      'id':x.get('id') or x.get('note_id'),
                      'type':x.get('type') or x.get('note_type'),
                      'object_type':x.get('object_type'),
                      'created_by':x.get('created_by'),
                      'date_create':ts,
                      'event_ts':event_ts,
                      'chat_id':x.get('chat_id'),
                      'text':text,
                      'data_keys':sorted((x.get('data') or {}).keys()) if isinstance(x.get('data'),dict) else [],
                  })

              before=[x for x in rows if 0<int(x.get('event_ts') or 0)<closed_at]
              before.sort(key=lambda x:int(x.get('event_ts') or 0))
              print(json.dumps({
                  'lead_id':lead_id,
                  'http':200,
                  'count':len(items),
                  'last_before_close':before[-8:],
                  'links':payload.get('_links') or {},
              },ensure_ascii=False),flush=True)
          PY
