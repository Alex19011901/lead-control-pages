name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Extract amoCRM fetchMessages endpoints
        run: |
          python - <<'PY'
          import json,re,urllib.request
          url='https://statix.amocrm.ru/frontend/build/61179.e4e5e039b9efcd5d.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'},method='GET')
          with urllib.request.urlopen(req,timeout=20) as r:
              text=r.read().decode('utf-8','ignore')
          hits={}
          for needle in ('fetchMessages:function','fetchMessagesMultiple:function','fetchMessagesById:function','sendMessagev1:function'):
              pos=text.find(needle)
              if pos<0:
                  hits[needle]=[]
                  continue
              chunk=text[max(0,pos-4000):pos+8000]
              strings=[]
              for m in re.finditer(r'["\']([^"\']{1,300})["\']',chunk):
                  s=m.group(1)
                  sl=s.lower()
                  if any(k in sl for k in ('/ajax/','chat','message','amojo','v1/','v2/','v3/','v4/')):
                      if s not in strings:
                          strings.append(s)
              hits[needle]=strings[:120]
          direct=[]
          for m in re.finditer(r'["\']([^"\']*/ajax/[^"\']*)["\']',text):
              s=m.group(1)
              if any(k in s.lower() for k in ('chat','message','amojo')) and s not in direct:
                  direct.append(s)
          print(json.dumps({'hits':hits,'direct':direct[:300]},ensure_ascii=False),flush=True)
          PY
