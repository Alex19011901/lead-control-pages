name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pre-close repair before real-data validation
        working-directory: app
        run: PYTHONPATH=.:src python -m unittest tests.test_preclose_record_recovery tests.test_closed_not_realized tests.test_closed_not_realized_widget tests.test_crm_feedback tests.test_dashboard_snapshot -v
      - name: Validate current closed rows without changing CRM or dashboard data
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          PYTHONPATH=app/src python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime
          from lead_control.closed_not_realized import apply_closed_not_realized_history

          token = os.environ['AMOCRM_TOKEN']
          domain = 'https://alex1901yaru.amocrm.ru'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class ReadOnlyClient:
              def __init__(self):
                  self.calls = 0
                  self.opener = urllib.request.build_opener(NoRedirect)
              def _request_json(self, path, params):
                  if not (
                      path in ('/api/v4/leads/notes', '/api/v4/events', '/api/v4/tasks', '/api/v4/talks')
                      or path.startswith('/api/v4/talks/')
                      or path.startswith('/api/v4/events/')
                  ):
                      raise AssertionError('Unexpected endpoint')
                  self.calls += 1
                  req = urllib.request.Request(domain + path + '?' + urllib.parse.urlencode(params), headers={'Accept': 'application/json', 'Authorization': 'Bearer ' + token}, method='GET')
                  try:
                      with self.opener.open(req, timeout=25) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      print(json.dumps({'http_error': exc.code, 'path': path}), flush=True)
                      if exc.code in (400, 404):
                          raise RuntimeError('CRM history HTTP ' + str(exc.code)) from None
                      raise SystemExit('Stopped after authorization/rate/server error; no retry')
                  except (urllib.error.URLError, TimeoutError):
                      raise SystemExit('Stopped after network error; no retry')

          class NoRequests:
              def _request_json(self, *args, **kwargs):
                  raise AssertionError('Saved closed record triggered another history request')
              def _get_entity(self, *args, **kwargs):
                  raise AssertionError('Saved closed record triggered another card request')

          view = json.load(open('dashboard_view.json'))
          rows = view.get('closed_not_realized') or []
          if not rows:
              raise SystemExit('No closed rows to validate')
          now_ts = int(datetime.fromisoformat(view['snapshot_generated_at'].replace('Z', '+00:00')).timestamp())
          originals = []
          for row in rows:
              originals.append({'id': 'check-' + str(row['crm_lead_id']), 'crm': {'found': True, 'entity_type': 'lead', 'entity_id': row['crm_lead_id']}, 'crm_feedback': {'status_id': 143, 'status_name': 'Закрыто и не реализовано', 'closed_at': row['closed_ts'], 'loss_reason_checked': True, 'loss_reason_name': row.get('reason') or ''}})
          leads = copy.deepcopy(originals)
          client = ReadOnlyClient()
          apply_closed_not_realized_history(leads, client, now_ts=now_ts)
          records = [x['closed_not_realized'] for x in leads]
          states = Counter(x['last_record_status'] for x in records)
          for record in records:
              text = record.get('last_comment') or ''
              print(json.dumps({'lead_id': record['crm_lead_id'], 'state': record['last_record_status'], 'record_type': record['last_record_type'], 'record_at': record['last_record_at'], 'closed_at': record['closed_at'], 'text_length': len(text), 'text_sha256': hashlib.sha256(text.encode()).hexdigest() if text else None}, ensure_ascii=False), flush=True)
          assert states['READ_ERROR'] == 0, 'Some history sources are still failing'
          second = copy.deepcopy(originals)
          apply_closed_not_realized_history(second, NoRequests(), now_ts=now_ts, previous_leads=leads)
          assert [x['closed_not_realized'] for x in second] == records
          print(json.dumps({'preclose_validation': {'rows': len(rows), 'states': dict(states), 'requests_first_pass': client.calls, 'requests_second_pass': 0, 'production_data_modified': False}}, ensure_ascii=False), flush=True)

          # Inspect only the STRUCTURE of records around the target lead.
          target_id = 48855703
          target_closed = next((int(r['closed_ts']) for r in rows if int(r['crm_lead_id']) == target_id), 0)
          def safe_shape(v, depth=0):
              if depth > 4:
                  return type(v).__name__
              if isinstance(v, dict):
                  out = {}
                  for k, val in list(v.items())[:30]:
                      key = str(k)
                      if key.lower() in {'text','message','comment','body','result','value','name'}:
                          if isinstance(val, str):
                              out[key] = {'type': 'str', 'len': len(val), 'nonempty': bool(val.strip())}
                          else:
                              out[key] = safe_shape(val, depth + 1)
                      else:
                          out[key] = safe_shape(val, depth + 1)
                  return out
              if isinstance(v, list):
                  return [safe_shape(v[0], depth + 1)] if v else []
              return type(v).__name__

          for label, path, params, collection in [
              ('notes', '/api/v4/leads/notes', {'filter[entity_id][0]': target_id, 'limit': 250}, 'notes'),
              ('events', '/api/v4/events', {'filter[entity]': 'lead', 'filter[entity_id]': target_id, 'filter[created_at][from]': max(1, target_closed - 86400*7), 'filter[created_at][to]': max(1, target_closed - 1), 'limit': 100}, 'events'),
              ('tasks', '/api/v4/tasks', {'filter[entity_type]': 'leads', 'filter[entity_id]': target_id, 'limit': 250}, 'tasks'),
              ('talks', '/api/v4/talks', {'filter[entity_id][0]': target_id, 'filter[entity_type]': 'lead', 'limit': 250}, 'talks'),
          ]:
              payload = client._request_json(path, params)
              items = (payload.get('_embedded') or {}).get(collection) or []
              print(json.dumps({'target_structure': label, 'count': len(items), 'items': [
                  {'id': x.get('id') or x.get('talk_id'), 'type': x.get('type') or x.get('note_type') or x.get('origin'), 'created_at': x.get('created_at'), 'updated_at': x.get('updated_at'), 'is_completed': x.get('is_completed'), 'shape': safe_shape(x)}
                  for x in items if isinstance(x, dict) and (
                      label == 'talks' or int(x.get('created_at') or x.get('updated_at') or 0) >= target_closed - 86400*7
                  )
              ][-20:]}, ensure_ascii=False), flush=True)
              if label == 'events':
                  direct = next((x for x in items if isinstance(x, dict) and x.get('type') == 'entity_direct_message'), None)
                  if direct and direct.get('id'):
                      event_detail = client._request_json('/api/v4/events/' + str(direct['id']), {})
                      print(json.dumps({'target_event_detail': {'event_id': direct['id'], 'shape': safe_shape(event_detail)}}, ensure_ascii=False), flush=True)
              if label == 'talks':
                  for talk in items:
                      tid = talk.get('talk_id')
                      if tid:
                          detail = client._request_json('/api/v4/talks/' + str(tid), {})
                          print(json.dumps({'target_talk_detail': {'talk_id': tid, 'shape': safe_shape(detail)}}, ensure_ascii=False), flush=True)

          def raw_get(label, path, params=None):
              params = params or {}
              url = domain + path + (('?' + urllib.parse.urlencode(params, doseq=True)) if params else '')
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'Authorization': 'Bearer ' + token}, method='GET')
              try:
                  with client.opener.open(req, timeout=25) as response:
                      raw = response.read()
                      payload = json.loads(raw) if raw else {}
                      print(json.dumps({'extra_check': label, 'http': response.status, 'shape': safe_shape(payload)}, ensure_ascii=False), flush=True)
                      return payload
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'extra_check': label, 'http': exc.code}), flush=True)
                  return {}

          # 1) Official entity-specific notes endpoint for the target card.
          target_notes = raw_get('target_specific_notes', f'/api/v4/leads/{target_id}/notes', {'limit': 250, 'page': 1})
          notes_items = (target_notes.get('_embedded') or {}).get('notes') or []
          print(json.dumps({'target_specific_notes_count': len(notes_items), 'items': [
              {'id': x.get('id'), 'note_type': x.get('note_type'), 'created_at': x.get('created_at'), 'shape': safe_shape(x)}
              for x in notes_items[-20:] if isinstance(x, dict)
          ]}, ensure_ascii=False), flush=True)

          # 2) Exact event payload by ID for the final event before close.
          event_list = client._request_json('/api/v4/events', {
              'filter[entity]': 'lead',
              'filter[entity_id]': target_id,
              'filter[created_at][from]': max(1, target_closed - 86400*7),
              'filter[created_at][to]': max(1, target_closed - 1),
              'limit': 100,
          })
          event_items = (event_list.get('_embedded') or {}).get('events') or []
          target_event = max(
              (x for x in event_items if isinstance(x, dict) and int(x.get('created_at') or 0) < target_closed),
              key=lambda x: int(x.get('created_at') or 0),
              default=None,
          )
          if target_event and target_event.get('id'):
              raw_get('target_event_by_id', '/api/v4/events/' + str(target_event['id']))

          # 3) Find linked contacts and inspect customer-chat events through the contact filter.
          lead_card = raw_get('target_lead_contacts', f'/api/v4/leads/{target_id}', {'with': 'contacts'})
          contacts = [int(x.get('id')) for x in ((lead_card.get('_embedded') or {}).get('contacts') or []) if x.get('id')]
          print(json.dumps({'target_contact_ids': contacts}, ensure_ascii=False), flush=True)
          for contact_id in contacts[:5]:
              chat_events = raw_get(
                  'contact_chat_events_' + str(contact_id),
                  '/api/v4/events',
                  [
                      ('filter[entity][]', 'contact'),
                      ('filter[entity_id][]', str(contact_id)),
                      ('filter[type][]', 'incoming_chat_message'),
                      ('filter[type][]', 'outgoing_chat_message'),
                      ('filter[created_at][from]', str(max(1, target_closed - 86400*30))),
                      ('filter[created_at][to]', str(max(1, target_closed - 1))),
                      ('limit', '100'),
                  ],
              )
              chat_items = (chat_events.get('_embedded') or {}).get('events') or []
              print(json.dumps({'contact_chat_events': contact_id, 'count': len(chat_items), 'items': [
                  {'id': x.get('id'), 'type': x.get('type'), 'entity_id': x.get('entity_id'), 'entity_type': x.get('entity_type'), 'created_at': x.get('created_at'), 'shape': safe_shape(x)}
                  for x in chat_items[-20:] if isinstance(x, dict)
              ]}, ensure_ascii=False), flush=True)

          # Inspect linked talk metadata through the same amoCRM OAuth token.
          def raw_get_simple(label, path, pairs):
              url = domain + path + ('?' + urllib.parse.urlencode(pairs) if pairs else '')
              req = urllib.request.Request(url, headers={'Accept': 'application/json', 'Authorization': 'Bearer ' + token}, method='GET')
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read()
                      payload = json.loads(raw) if raw else {}
                      print(json.dumps({'talk_check': label, 'http': response.status, 'shape': safe_shape(payload)}, ensure_ascii=False), flush=True)
                      return payload
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'talk_check': label, 'http': exc.code}), flush=True)
                  if exc.code in (400, 404, 204):
                      return {}
                  raise SystemExit('Stopped after talk authorization/rate/server error; no retry')
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit('Stopped after talk network error; no retry')

          talks = raw_get_simple('target_talks', '/api/v4/talks', [
              ('filter[entity_id]', target_id),
              ('filter[entity_type]', 'lead'),
              ('limit', 250),
          ])
          talk_items = (talks.get('_embedded') or {}).get('talks') or []
          print(json.dumps({'talks_target': [
              {
                  'talk_id': x.get('talk_id'),
                  'chat_id': x.get('chat_id'),
                  'contact_id': x.get('contact_id'),
                  'entity_id': x.get('entity_id'),
                  'entity_type': x.get('entity_type'),
                  'origin': x.get('origin'),
                  'source_id': x.get('source_id'),
                  'created_at': x.get('created_at'),
                  'updated_at': x.get('updated_at'),
                  'status': x.get('status'),
              }
              for x in talk_items if isinstance(x, dict)
          ]}, ensure_ascii=False), flush=True)

          raw_get_simple('account_amojo', '/api/v4/account', [('with', 'amojo_id')])

          # Compare a previously populated row with the currently empty target.
          for compare_id, compare_closed in [
              (48855703, 1790579990),  # Божена
              (48909969, 1790248804),  # Елизавета: previously showed a comment
          ]:
              n = client._request_json('/api/v4/leads/notes', {
                  'filter[entity_id][0]': compare_id, 'limit': 250, 'page': 1,
              })
              e = client._request_json('/api/v4/events', {
                  'filter[entity]': 'lead',
                  'filter[entity_id]': compare_id,
                  'filter[created_at][from]': max(1, compare_closed - 86400*30),
                  'filter[created_at][to]': max(1, compare_closed - 1),
                  'limit': 100, 'page': 1,
              })
              t = client._request_json('/api/v4/tasks', {
                  'filter[entity_type]': 'leads',
                  'filter[entity_id]': compare_id,
                  'limit': 250, 'page': 1,
              })
              notes = (n.get('_embedded') or {}).get('notes') or []
              events = (e.get('_embedded') or {}).get('events') or []
              tasks = (t.get('_embedded') or {}).get('tasks') or []

              note_rows = []
              for x in notes:
                  if not isinstance(x, dict):
                      continue
                  ts = int(x.get('created_at') or 0)
                  if not 0 < ts < compare_closed:
                      continue
                  params = x.get('params') or {}
                  txt = ''
                  if isinstance(params, dict):
                      txt = str(params.get('text') or '')
                  note_rows.append({
                      'id': x.get('id'),
                      'type': x.get('note_type'),
                      'at': ts,
                      'text_len': len(txt),
                      'has_text': bool(txt.strip()),
                  })

              event_rows = []
              for x in events:
                  if not isinstance(x, dict):
                      continue
                  ts = int(x.get('created_at') or 0)
                  if not 0 < ts < compare_closed:
                      continue
                  va = x.get('value_after')
                  has_message_id = False
                  has_text = False
                  if isinstance(va, list):
                      for part in va:
                          if not isinstance(part, dict):
                              continue
                          msg = part.get('message')
                          if isinstance(msg, dict):
                              has_message_id = bool(msg.get('id'))
                              has_text = bool(str(msg.get('text') or '').strip())
                  event_rows.append({
                      'id': x.get('id'),
                      'type': x.get('type'),
                      'at': ts,
                      'has_message_id': has_message_id,
                      'has_text': has_text,
                  })

              task_rows = []
              for x in tasks:
                  if not isinstance(x, dict) or not x.get('is_completed'):
                      continue
                  ts = int(x.get('updated_at') or 0)
                  if not 0 < ts < compare_closed:
                      continue
                  result = x.get('result') or {}
                  txt = str(result.get('text') or '') if isinstance(result, dict) else ''
                  task_rows.append({
                      'id': x.get('id'),
                      'at': ts,
                      'text_len': len(txt),
                      'has_text': bool(txt.strip()),
                  })

              print(json.dumps({
                  'compare_lead': compare_id,
                  'closed_at': compare_closed,
                  'notes': sorted(note_rows, key=lambda z: z['at'])[-10:],
                  'events': sorted(event_rows, key=lambda z: z['at'])[-10:],
                  'tasks': sorted(task_rows, key=lambda z: z['at'])[-10:],
              }, ensure_ascii=False), flush=True)

          # Check whether the existing amoCRM OAuth token is also valid for the
          # corporate messenger API. Log only HTTP/status metadata, never token data.
          def external_get(label, url):
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/json',
                      'Authorization': 'Bearer ' + token,
                      'Content-Type': 'application/json',
                  },
                  method='GET',
              )
              try:
                  with urllib.request.urlopen(req, timeout=25) as response:
                      raw = response.read()
                      payload = {}
                      try:
                          payload = json.loads(raw) if raw else {}
                      except ValueError:
                          payload = {}
                      print(json.dumps({
                          'messenger_check': label,
                          'http': response.status,
                          'shape': safe_shape(payload),
                      }, ensure_ascii=False), flush=True)
                      return payload
              except urllib.error.HTTPError as exc:
                  print(json.dumps({'messenger_check': label, 'http': exc.code}), flush=True)
                  if exc.code in (400, 401, 403, 404):
                      return {}
                  raise SystemExit('Stopped after messenger rate/server error; no retry')
              except (urllib.error.URLError, TimeoutError):
                  raise SystemExit('Stopped after messenger network error; no retry')

          external_get('oauth_validate', 'https://id.amo.io/oauth2/validate')
          PY
          PY
