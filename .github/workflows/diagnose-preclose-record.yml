# rerun-marker: diagnose-oct10-event-pipeline-20261011
name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect Oct 10 event pipeline
        run: |
          PYTHONPATH=app/src python - <<'PY'
          import json
          from pathlib import Path
          from lead_control.parsers.max_leads import classify_max_event
          from lead_control.processor import rebuild_leads_and_needs_review
          from lead_control.max_mail_lead_apply import apply_max_mail_leads
          from lead_control.source_categories import normalize_known_source_events

          mid='mid.ffffbec8f345ffab01a12658ca2a1b96'
          events=[]
          for line in Path('runtime-data/events.ndjson').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              try:
                  x=json.loads(line)
              except Exception:
                  continue
              if str(x.get('message_id') or '')==mid:
                  print('RAW_EVENT '+json.dumps(x,ensure_ascii=False),flush=True)
              events.append(x)

          events=normalize_known_source_events(events)
          event=next((x for x in events if str(x.get('message_id') or '')==mid),None)
          print('NORMALIZED_EVENT '+json.dumps(event,ensure_ascii=False),flush=True)
          if event:
              print('CLASSIFICATION '+json.dumps(classify_max_event(event),ensure_ascii=False),flush=True)

          leads,review=rebuild_leads_and_needs_review(events, existing_needs_review=[])
          matches=[x for x in leads if str(x.get('message_id') or '')==mid or mid in [str(v) for v in ((x.get('max') or {}).get('message_ids') or [])]]
          print('REBUILD_MATCHES '+json.dumps(matches,ensure_ascii=False),flush=True)
          print('REVIEW_MATCHES '+json.dumps([x for x in review if str(x.get('message_id') or '')==mid],ensure_ascii=False),flush=True)

          apply_max_mail_leads(leads,events)
          matches=[x for x in leads if str(x.get('message_id') or '')==mid or mid in [str(v) for v in ((x.get('max') or {}).get('message_ids') or [])]]
          print('AFTER_MAIL '+json.dumps(matches,ensure_ascii=False),flush=True)
          PY
