name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect text-bearing amoCRM timeline item
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          token=os.environ['AMOCRM_TOKEN']
          base='https://alex1901yaru.amocrm.ru'
          lead_id=48813485
          url=f'{base}/ajax/v3/leads/{lead_id}/timeline/?page=1'
          req=urllib.request.Request(url,headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/json,text/plain,*/*',
              'User-Agent':'Mozilla/5.0',
              'Referer':f'{base}/leads/detail/{lead_id}',
              'X-Requested-With':'XMLHttpRequest',
          },method='GET')
          with urllib.request.urlopen(req,timeout=20) as r:
              p=json.loads(r.read().decode('utf-8','ignore') or '{}')
          items=(p.get('_embedded') or {}).get('items') or []
          out=[]
          for x in items:
              if not isinstance(x,dict):
                  continue
              data=x.get('data') or {}
              text=''
              if isinstance(data,dict):
                  v=data.get('text')
                  if isinstance(v,str):
                      text=v.strip()
              if text or x.get('chat_id') or (isinstance(data,dict) and any(k in data for k in ('message','chat_id','msec_created_at','timestamp'))):
                  out.append({
                      'id':x.get('id'),
                      'type':x.get('type'),
                      'object_type':x.get('object_type'),
                      'created_by':x.get('created_by'),
                      'date_create':x.get('date_create'),
                      'msec_created_at':x.get('msec_created_at'),
                      'chat_id':x.get('chat_id'),
                      'text':text,
                      'data':data,
                  })
          print(json.dumps({'items':out},ensure_ascii=False),flush=True)
          PY
