name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pre-close manager record logic
        working-directory: app
        run: PYTHONPATH=.:src python -m unittest tests.test_preclose_record_recovery tests.test_closed_not_realized tests.test_closed_not_realized_widget -v
      - name: Validate real manager text through production code
        working-directory: app
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
          AMOCRM_DOMAIN: https://alex1901yaru.amocrm.ru
        run: |
          PYTHONPATH=.:src python - <<'PY'
          import json, os
          from lead_control.amocrm_client import AmoCRMClient
          from lead_control.closed_not_realized import _read_preclose_record

          client=AmoCRMClient(os.environ['AMOCRM_DOMAIN'],os.environ['AMOCRM_TOKEN'])
          record=_read_preclose_record(
              client,
              48813485,
              1790580620,
              responsible_user_id=13009530,
          )
          summary={
              'status':record.get('last_record_status'),
              'author':record.get('last_record_author'),
              'record_at':record.get('last_record_at'),
              'text_length':len(str(record.get('last_comment') or '')),
              'has_text':bool(str(record.get('last_comment') or '').strip()),
              'record_type':record.get('last_record_type'),
          }
          print(json.dumps(summary,ensure_ascii=False),flush=True)
          assert summary['status']=='VERIFIED'
          assert summary['author']=='Олеся'
          assert summary['record_at']==1790580615
          assert summary['has_text']
          assert summary['text_length']>10
          PY
