name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Extract exact amoCRM message URL builder
        run: |
          python - <<'PY'
          import json,urllib.request
          url='https://statix.amocrm.ru/frontend/build/61179.e4e5e039b9efcd5d.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'},method='GET')
          with urllib.request.urlopen(req,timeout=20) as r:
              text=r.read().decode('utf-8','ignore')
          out={}
          for needle in ('fetchMessages:function','fetchMessagesMultiple:function','fetchMessagesById:function'):
              pos=text.find(needle)
              out[needle]=text[max(0,pos-1600):pos+2600] if pos>=0 else ''
          print(json.dumps(out,ensure_ascii=False),flush=True)
          PY
