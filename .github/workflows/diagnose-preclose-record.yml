name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Find fetchMessagesById call sites
        run: |
          python - <<'PY'
          import json,re,urllib.request
          urls=[
            "https://statix.amocrm.ru/frontend/build/61179.e4e5e039b9efcd5d.js",
            "https://statix.amocrm.ru/frontend/build/72055.3aaf8668fcbe0efa.js",
            "https://statix.amocrm.ru/frontend/build/cards.5882b28acb4ffff2.js",
            "https://statix.amocrm.ru/frontend/build/common.d0f691c50ac7a91e.js",
            "https://statix.amocrm.ru/frontend/build/app.bc39e01e19e8400a.js",
          ]
          out=[]
          for url in urls:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=20) as r:
                      text=r.read().decode('utf-8','ignore')
              except Exception:
                  continue
              for needle in ('fetchMessagesById','fetchMessagesById('):
                  start=0
                  while True:
                      pos=text.find(needle,start)
                      if pos<0: break
                      out.append({
                          'file':url.rsplit('/',1)[-1],
                          'needle':needle,
                          'snippet':text[max(0,pos-1400):pos+2600],
                      })
                      start=pos+len(needle)
                      if len(out)>=30: break
                  if len(out)>=30: break
              if len(out)>=30: break
          print(json.dumps(out,ensure_ascii=False),flush=True)
          PY
