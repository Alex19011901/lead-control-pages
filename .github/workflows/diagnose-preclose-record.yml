name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Inspect lead page for embedded chat constants
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.request
          token=os.environ['AMOCRM_TOKEN']
          base='https://alex1901yaru.amocrm.ru'
          lead_id=48813485
          req=urllib.request.Request(
              f'{base}/leads/detail/{lead_id}',
              headers={'Authorization':'Bearer '+token,'Accept':'text/html','User-Agent':'Mozilla/5.0'},
              method='GET',
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              text=r.read().decode('utf-8','ignore')
          hits=[]
          low=text.lower()
          for needle in ('amojo_chats','chat_id','entity_direct_message','internal_chat','amojo_users'):
              start=0
              while True:
                  pos=low.find(needle,start)
                  if pos<0: break
                  sn=re.sub(r'\s+',' ',text[max(0,pos-1200):pos+3500])
                  hits.append({'needle':needle,'snippet':sn[:4700]})
                  start=pos+len(needle)
                  if len([x for x in hits if x['needle']==needle])>=6: break
          print(json.dumps({'length':len(text),'hits':hits},ensure_ascii=False),flush=True)
          PY
