name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect direct-message event name only
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          token=os.environ['AMOCRM_TOKEN']
          event_id='01m3ke4epft5pqe63t4x14cc4z'
          url='https://alex1901yaru.amocrm.ru/api/v4/events/'+event_id
          req=urllib.request.Request(url,headers={'Accept':'application/json','Authorization':'Bearer '+token},method='GET')
          try:
              with urllib.request.urlopen(req,timeout=20) as r:
                  p=json.loads(r.read() or b'{}')
                  print(json.dumps({
                      'http':r.status,
                      'type':p.get('type'),
                      'name':p.get('name'),
                      'created_at':p.get('created_at'),
                      'created_by':p.get('created_by'),
                  },ensure_ascii=False),flush=True)
          except urllib.error.HTTPError as e:
              print(json.dumps({'http':e.code}),flush=True)
              raise SystemExit(1)
          PY
