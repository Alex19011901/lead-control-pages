# rerun-marker: validate-oct13-site-tilda-20261014
name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test one-off source override
        working-directory: app
        run: PYTHONPATH=.:src python -m unittest tests.test_source_categories -v
      - name: Validate Oct 13 CRM match read only
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          PYTHONPATH=app/src python - <<'PY'
          import json, os
          from lead_control.amocrm_client import AmoCRMClient

          client=AmoCRMClient('https://alex1901yaru.amocrm.ru', os.environ['AMOCRM_TOKEN'])
          result=client.search(
              '79035665530',
              'oct13-site-tilda',
              'phone',
              target_created_at=1791902287,
          )
          card=client._get_entity('leads', int(result.entity_id)) if result.found and result.entity_id else {}
          manager=client._get_user_name((card or {}).get('responsible_user_id')) if card else ''
          status_id=(card or {}).get('status_id')
          pipeline_id=(card or {}).get('pipeline_id')
          status_name=''
          if pipeline_id and status_id:
              status=client._request_json(f'/api/v4/leads/pipelines/{int(pipeline_id)}/statuses/{int(status_id)}', {})
              status_name=str(status.get('name') or '')
          print('OCT13_MATCH '+json.dumps({
              'found':result.found,
              'entity_id':result.entity_id,
              'created_at':result.created_at,
              'manager':manager,
              'status_id':status_id,
              'status_name':status_name,
              'event_type':result.event_type,
          },ensure_ascii=False),flush=True)
          PY
