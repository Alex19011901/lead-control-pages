# rerun-marker: diagnose-missing-20261010-1805
name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect 10 Oct 17:55-18:15 data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          from zoneinfo import ZoneInfo

          tz=ZoneInfo('Europe/Moscow')
          start=int(datetime(2026,10,10,17,55,tzinfo=tz).timestamp())
          end=int(datetime(2026,10,10,18,15,tzinfo=tz).timestamp())

          def sec(v):
              try:
                  n=int(v or 0)
              except Exception:
                  return 0
              return n//1000 if n>10_000_000_000 else n

          events=[]
          for line in Path('runtime-data/events.ndjson').read_text(encoding='utf-8').splitlines():
              if not line.strip():
                  continue
              try:
                  x=json.loads(line)
              except Exception:
                  continue
              ts=sec(x.get('timestamp') or x.get('telegram_date'))
              if start <= ts <= end:
                  events.append(x)
          print('EVENTS '+json.dumps(events,ensure_ascii=False),flush=True)

          leads=json.loads(Path('runtime-data/leads.json').read_text(encoding='utf-8')).get('leads',[])
          lr=[]
          for x in leads:
              raw=x.get('first_seen_ts') or x.get('received_at') or x.get('first_seen_at')
              if isinstance(raw,str):
                  try:
                      ts=int(datetime.fromisoformat(raw).timestamp())
                  except Exception:
                      ts=0
              else:
                  ts=sec(raw)
              if start <= ts <= end:
                  lr.append(x)
          print('LEADS '+json.dumps(lr,ensure_ascii=False),flush=True)

          review=json.loads(Path('runtime-data/needs_review.json').read_text(encoding='utf-8')).get('items',[])
          rr=[]
          for x in review:
              ts=sec(x.get('timestamp') or x.get('telegram_date'))
              if start <= ts <= end:
                  rr.append(x)
          print('REVIEW '+json.dumps(rr,ensure_ascii=False),flush=True)
          PY
