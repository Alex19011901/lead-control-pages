name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: List amoCRM lead-card script URLs
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          token=os.environ['AMOCRM_TOKEN']
          base='https://alex1901yaru.amocrm.ru'
          req=urllib.request.Request(
              base+'/leads/detail/48813485',
              headers={'Authorization':'Bearer '+token,'Accept':'text/html','User-Agent':'Mozilla/5.0'},
              method='GET',
          )
          with urllib.request.urlopen(req,timeout=20) as r:
              html=r.read().decode('utf-8','ignore')
          scripts=[]
          for src in re.findall(r'<script[^>]+src=["\']([^"\']+)["\']',html,re.I):
              url=urllib.parse.urljoin(base,src)
              if url not in scripts:
                  scripts.append(url)
          print(json.dumps({'script_urls':scripts},ensure_ascii=False),flush=True)
          PY
