name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public amoCRM card bundles with browser headers
        run: |
          python - <<'PY'
          import json, re, urllib.request
          urls=[
            'https://statix.amocrm.ru/frontend/build/cards.5882b28acb4ffff2.js',
            'https://statix.amocrm.ru/frontend/build/common.d0f691c50ac7a91e.js',
            'https://statix.amocrm.ru/frontend/build/app.bc39e01e19e8400a.js',
          ]
          for url in urls:
              req=urllib.request.Request(url,headers={
                  'User-Agent':'Mozilla/5.0',
                  'Referer':'https://alex1901yaru.amocrm.ru/',
                  'Accept':'*/*',
              },method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=25) as r:
                      text=r.read().decode('utf-8','ignore')
                      low=text.lower()
                      paths=sorted(set(re.findall(r'["\']([^"\']*(?:ajax|chat|message|feed|timeline|amojo)[^"\']*)["\']',text,re.I)))
                      print(json.dumps({
                          'url':url,
                          'http':r.status,
                          'content_type':r.headers.get('Content-Type'),
                          'length':len(text),
                          'starts_with':re.sub(r'\s+',' ',text[:160]),
                          'has_entity_direct_message':'entity_direct_message' in low,
                          'candidate_paths':[p for p in paths if len(p)<240][:120],
                      },ensure_ascii=False),flush=True)
              except Exception as e:
                  print(json.dumps({'url':url,'error':type(e).__name__}),flush=True)
          PY
