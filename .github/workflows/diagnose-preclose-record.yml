name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect amoCRM feed request construction
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url='https://statix.amocrm.ru/frontend/build/72055.3aaf8668fcbe0efa.js'
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0','Referer':'https://alex1901yaru.amocrm.ru/','Accept':'*/*'},method='GET')
          with urllib.request.urlopen(req,timeout=25) as r:
              text=r.read().decode('utf-8','ignore')
          needles=['/ajax/v3/notes/','chat_id','message_updated','amojo_chats']
          out=[]
          for needle in needles:
              start=0
              while True:
                  pos=text.find(needle,start)
                  if pos<0: break
                  sn=re.sub(r'\s+',' ',text[max(0,pos-1400):pos+2200])
                  out.append({'needle':needle,'snippet':sn[:3600]})
                  start=pos+len(needle)
                  if len([x for x in out if x['needle']==needle])>=5: break
          print(json.dumps({'snippets':out},ensure_ascii=False),flush=True)
          PY
