name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test pre-close repair before real-data validation
        working-directory: app
        run: PYTHONPATH=.:src python -m unittest tests.test_preclose_record_recovery tests.test_closed_not_realized tests.test_closed_not_realized_widget tests.test_crm_feedback tests.test_dashboard_snapshot -v
      - name: Validate current closed rows without changing CRM or dashboard data
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          PYTHONPATH=app/src python - <<'PY'
          import copy
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from collections import Counter
          from datetime import datetime
          from lead_control.closed_not_realized import apply_closed_not_realized_history

          token = os.environ['AMOCRM_TOKEN']
          domain = 'https://alex1901yaru.amocrm.ru'

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          class ReadOnlyClient:
              def __init__(self):
                  self.calls = 0
                  self.opener = urllib.request.build_opener(NoRedirect)
              def _request_json(self, path, params):
                  if not (
                      path in ('/api/v4/leads/notes', '/api/v4/events', '/api/v4/tasks', '/api/v4/talks')
                      or path.startswith('/api/v4/talks/')
                      or path.startswith('/api/v4/events/')
                  ):
                      raise AssertionError('Unexpected endpoint')
                  self.calls += 1
                  req = urllib.request.Request(domain + path + '?' + urllib.parse.urlencode(params), headers={'Accept': 'application/json', 'Authorization': 'Bearer ' + token}, method='GET')
                  try:
                      with self.opener.open(req, timeout=25) as response:
                          raw = response.read()
                          return json.loads(raw) if raw else {}
                  except urllib.error.HTTPError as exc:
                      print(json.dumps({'http_error': exc.code, 'path': path}), flush=True)
                      if exc.code in (400, 404):
                          raise RuntimeError('CRM history HTTP ' + str(exc.code)) from None
                      raise SystemExit('Stopped after authorization/rate/server error; no retry')
                  except (urllib.error.URLError, TimeoutError):
                      raise SystemExit('Stopped after network error; no retry')

          class NoRequests:
              def _request_json(self, *args, **kwargs):
                  raise AssertionError('Saved closed record triggered another history request')
              def _get_entity(self, *args, **kwargs):
                  raise AssertionError('Saved closed record triggered another card request')

          view = json.load(open('dashboard_view.json'))
          rows = view.get('closed_not_realized') or []
          if not rows:
              raise SystemExit('No closed rows to validate')
          now_ts = int(datetime.fromisoformat(view['snapshot_generated_at'].replace('Z', '+00:00')).timestamp())
          originals = []
          for row in rows:
              originals.append({'id': 'check-' + str(row['crm_lead_id']), 'crm': {'found': True, 'entity_type': 'lead', 'entity_id': row['crm_lead_id']}, 'crm_feedback': {'status_id': 143, 'status_name': 'Закрыто и не реализовано', 'closed_at': row['closed_ts'], 'loss_reason_checked': True, 'loss_reason_name': row.get('reason') or ''}})
          leads = copy.deepcopy(originals)
          client = ReadOnlyClient()
          apply_closed_not_realized_history(leads, client, now_ts=now_ts)
          records = [x['closed_not_realized'] for x in leads]
          states = Counter(x['last_record_status'] for x in records)
          for record in records:
              text = record.get('last_comment') or ''
              print(json.dumps({'lead_id': record['crm_lead_id'], 'state': record['last_record_status'], 'record_type': record['last_record_type'], 'record_at': record['last_record_at'], 'closed_at': record['closed_at'], 'text_length': len(text), 'text_sha256': hashlib.sha256(text.encode()).hexdigest() if text else None}, ensure_ascii=False), flush=True)
          assert states['READ_ERROR'] == 0, 'Some history sources are still failing'
          second = copy.deepcopy(originals)
          apply_closed_not_realized_history(second, NoRequests(), now_ts=now_ts, previous_leads=leads)
          assert [x['closed_not_realized'] for x in second] == records
          print(json.dumps({'preclose_validation': {'rows': len(rows), 'states': dict(states), 'requests_first_pass': client.calls, 'requests_second_pass': 0, 'production_data_modified': False}}, ensure_ascii=False), flush=True)

          # Inspect only the STRUCTURE of records around the target lead.
          target_id = 48855703
          target_closed = next((int(r['closed_ts']) for r in rows if int(r['crm_lead_id']) == target_id), 0)
          def safe_shape(v, depth=0):
              if depth > 4:
                  return type(v).__name__
              if isinstance(v, dict):
                  out = {}
                  for k, val in list(v.items())[:30]:
                      key = str(k)
                      if key.lower() in {'text','message','comment','body','result','value','name'}:
                          if isinstance(val, str):
                              out[key] = {'type': 'str', 'len': len(val), 'nonempty': bool(val.strip())}
                          else:
                              out[key] = safe_shape(val, depth + 1)
                      else:
                          out[key] = safe_shape(val, depth + 1)
                  return out
              if isinstance(v, list):
                  return [safe_shape(v[0], depth + 1)] if v else []
              return type(v).__name__

          for label, path, params, collection in [
              ('notes', '/api/v4/leads/notes', {'filter[entity_id][0]': target_id, 'limit': 250}, 'notes'),
              ('events', '/api/v4/events', {'filter[entity]': 'lead', 'filter[entity_id]': target_id, 'filter[created_at][from]': max(1, target_closed - 86400*7), 'filter[created_at][to]': max(1, target_closed - 1), 'limit': 100}, 'events'),
              ('tasks', '/api/v4/tasks', {'filter[entity_type]': 'leads', 'filter[entity_id]': target_id, 'limit': 250}, 'tasks'),
              ('talks', '/api/v4/talks', {'filter[entity_id][0]': target_id, 'filter[entity_type]': 'lead', 'limit': 250}, 'talks'),
          ]:
              payload = client._request_json(path, params)
              items = (payload.get('_embedded') or {}).get(collection) or []
              print(json.dumps({'target_structure': label, 'count': len(items), 'items': [
                  {'id': x.get('id') or x.get('talk_id'), 'type': x.get('type') or x.get('note_type') or x.get('origin'), 'created_at': x.get('created_at'), 'updated_at': x.get('updated_at'), 'is_completed': x.get('is_completed'), 'shape': safe_shape(x)}
                  for x in items if isinstance(x, dict) and (
                      label == 'talks' or int(x.get('created_at') or x.get('updated_at') or 0) >= target_closed - 86400*7
                  )
              ][-20:]}, ensure_ascii=False), flush=True)
              if label == 'events':
                  direct = next((x for x in items if isinstance(x, dict) and x.get('type') == 'entity_direct_message'), None)
                  if direct and direct.get('id'):
                      event_detail = client._request_json('/api/v4/events/' + str(direct['id']), {})
                      print(json.dumps({'target_event_detail': {'event_id': direct['id'], 'shape': safe_shape(event_detail)}}, ensure_ascii=False), flush=True)
              if label == 'talks':
                  for talk in items:
                      tid = talk.get('talk_id')
                      if tid:
                          detail = client._request_json('/api/v4/talks/' + str(tid), {})
                          print(json.dumps({'target_talk_detail': {'talk_id': tid, 'shape': safe_shape(detail)}}, ensure_ascii=False), flush=True)
          PY
