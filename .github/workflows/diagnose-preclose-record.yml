name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Walk amoCRM timeline pages to pre-close record
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error

          token=os.environ['AMOCRM_TOKEN']
          base='https://alex1901yaru.amocrm.ru'
          lead_id=48813485
          closed_at=1790580620
          headers={
              'Authorization':'Bearer '+token,
              'Accept':'application/json,text/plain,*/*',
              'User-Agent':'Mozilla/5.0',
              'Referer':f'{base}/leads/detail/{lead_id}',
              'X-Requested-With':'XMLHttpRequest',
          }

          def text_of(item):
              data=item.get('data') or {}
              if isinstance(data,dict):
                  for key in ('text','message','body','comment','value'):
                      val=data.get(key)
                      if isinstance(val,str) and val.strip():
                          return val.strip()
                      if isinstance(val,dict):
                          for k2 in ('text','message','body','value'):
                              vv=val.get(k2)
                              if isinstance(vv,str) and vv.strip():
                                  return vv.strip()
              return ''

          found=[]
          page_stats=[]
          for page in range(1,31):
              url=f'{base}/ajax/v3/leads/{lead_id}/timeline/?page={page}'
              req=urllib.request.Request(url,headers=headers,method='GET')
              try:
                  with urllib.request.urlopen(req,timeout=20) as r:
                      raw=r.read().decode('utf-8','ignore')
                      payload=json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  print(json.dumps({'page':page,'http':e.code}),flush=True)
                  break

              items=(payload.get('_embedded') or {}).get('items') or []
              if not items:
                  page_stats.append({'page':page,'count':0})
                  break

              rows=[]
              for item in items:
                  if not isinstance(item,dict):
                      continue
                  ts=int(item.get('date_create') or 0)
                  mts=int(item.get('msec_created_at') or 0)
                  event_ts=(mts//1000 if mts>10_000_000_000 else mts) or ts
                  row={
                      'id':item.get('id') or item.get('note_id'),
                      'type':item.get('type') or item.get('note_type'),
                      'object_type':item.get('object_type'),
                      'created_by':item.get('created_by'),
                      'event_ts':event_ts,
                      'chat_id':item.get('chat_id'),
                      'text':text_of(item),
                      'data':item.get('data') if isinstance(item.get('data'),dict) else {},
                  }
                  rows.append(row)
                  if abs(event_ts-closed_at)<=86400*2:
                      found.append(row)
              page_stats.append({
                  'page':page,
                  'count':len(rows),
                  'min_ts':min((r['event_ts'] for r in rows),default=0),
                  'max_ts':max((r['event_ts'] for r in rows),default=0),
                  'text_rows':sum(1 for r in rows if r['text']),
                  'links':payload.get('_links') or {},
              })
              if max((r['event_ts'] for r in rows),default=0)>=closed_at:
                  break

          found.sort(key=lambda x:x['event_ts'])
          # Keep only compact useful fields from records near close.
          compact=[]
          for r in found[-20:]:
              data=r.get('data') or {}
              compact.append({
                  'id':r['id'],'type':r['type'],'object_type':r['object_type'],
                  'created_by':r['created_by'],'event_ts':r['event_ts'],'chat_id':r['chat_id'],
                  'text':r['text'],
                  'data_keys':sorted(data.keys()),
                  'params_keys':sorted((data.get('params') or {}).keys()) if isinstance(data.get('params'),dict) else [],
              })
          print(json.dumps({'page_stats':page_stats,'near_close':compact},ensure_ascii=False),flush=True)
          PY
