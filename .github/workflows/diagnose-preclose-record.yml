name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect public amoCRM card bundle for timeline endpoints
        run: |
          python - <<'PY'
          import json, re, urllib.request
          urls=[
            'https://statix.amocrm.ru/frontend/build/cards.5882b28acb4ffff2.js',
            'https://statix.amocrm.ru/frontend/build/common.d0f691c50ac7a91e.js',
            'https://statix.amocrm.ru/frontend/build/app.bc39e01e19e8400a.js',
          ]
          needles=('entity_direct_message','amojo','timeline','feed','ajax','chat','message')
          for url in urls:
              try:
                  with urllib.request.urlopen(url,timeout=25) as r:
                      text=r.read().decode('utf-8','ignore')
              except Exception as e:
                  print(json.dumps({'url':url,'error':type(e).__name__}),flush=True)
                  continue
              found=[n for n in needles if n in text.lower()]
              paths=sorted(set(re.findall(r'["\']([^"\']*(?:ajax|chat|message|feed|timeline|amojo)[^"\']*)["\']',text,re.I)))
              clean=[]
              for p in paths:
                  if len(p)>240:
                      continue
                  if p not in clean:
                      clean.append(p)
              print(json.dumps({
                  'url':url,
                  'length':len(text),
                  'found':found,
                  'candidate_paths':clean[:120],
              },ensure_ascii=False),flush=True)
          PY
