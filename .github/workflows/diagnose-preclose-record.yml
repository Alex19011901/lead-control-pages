# rerun-marker: diagnose-yaroslav-mail-20261009
name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Find Yaroslav mail lead
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('runtime-data/leads.json').read_text(encoding='utf-8'))
          rows=data.get('leads',[])
          for lead in rows:
              ts=str(lead.get('received_at') or lead.get('first_seen_at') or '')
              source=str(lead.get('source') or lead.get('category') or '')
              name=str(lead.get('name') or (lead.get('fields') or {}).get('name') or '')
              if ts.startswith('2026-10-09T16:41:25') and 'ПОЧТА' in source.upper() and name=='Ярослав':
                  print('FOUND '+json.dumps({
                      'id':lead.get('id'),
                      'channel':lead.get('channel'),
                      'message_id':lead.get('message_id'),
                      'max':lead.get('max'),
                      'telegram':lead.get('telegram'),
                      'identifier':lead.get('identifier'),
                      'fields':lead.get('fields'),
                      'source':source,
                      'name':name,
                      'received_at':ts,
                  },ensure_ascii=False),flush=True)
          PY
