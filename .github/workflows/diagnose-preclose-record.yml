# rerun-marker: validate-stale-closed-crm-match-v2-20261001
name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run CRM matching regression tests
        working-directory: app
        run: PYTHONPATH=.:src python -m unittest tests.test_amocrm_deal_matching -v
      - name: Validate Tatiana current CRM match read only
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          PYTHONPATH=app/src python - <<'PY'
          import json, os
          from lead_control.amocrm_client import AmoCRMClient

          client=AmoCRMClient('https://alex1901yaru.amocrm.ru',os.environ['AMOCRM_TOKEN'])
          result=client.search(
              '79152636030',
              'tatiana-20260930-140137',
              'phone',
              target_created_at=1790766097,
          )
          card=client._get_entity('leads',int(result.entity_id)) if result.found and result.entity_id else {}
          manager=client._get_user_name((card or {}).get('responsible_user_id')) if card else ''
          print('TATIANA_MATCH '+json.dumps({
              'found': result.found,
              'entity_id': result.entity_id,
              'responsible_user_name': manager,
              'status_id': (card or {}).get('status_id'),
              'closed_at': (card or {}).get('closed_at'),
              'created_at': (card or {}).get('created_at'),
          },ensure_ascii=False),flush=True)
          assert result.found
          assert int(result.entity_id or 0)==49108667
          assert manager=='Олеся'
          PY
