name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect amoCRM timeline fetch modules
        run: |
          python - <<'PY'
          import json, re, urllib.request
          files=[
            'https://statix.amocrm.ru/frontend/build/74418.e036b6c65f385cfe.js',
            'https://statix.amocrm.ru/frontend/build/93836.8a8e8e8dd21fd767.js',
            'https://statix.amocrm.ru/frontend/build/72055.3aaf8668fcbe0efa.js',
          ]
          headers={'User-Agent':'Mozilla/5.0','Referer':'https://alex1901yaru.amocrm.ru/','Accept':'*/*'}
          needles=['/ajax/v3/','/timeline','timeline','notes/','amojo_chats']
          for url in files:
              req=urllib.request.Request(url,headers=headers,method='GET')
              with urllib.request.urlopen(req,timeout=25) as r:
                  text=r.read().decode('utf-8','ignore')
              out=[]
              low=text.lower()
              for needle in needles:
                  start=0
                  while True:
                      pos=low.find(needle.lower(),start)
                      if pos<0: break
                      sn=re.sub(r'\s+',' ',text[max(0,pos-1800):pos+3200])
                      out.append({'needle':needle,'snippet':sn[:5000]})
                      start=pos+len(needle)
                      if len([x for x in out if x['needle']==needle])>=6: break
              print(json.dumps({'file':url.rsplit('/',1)[-1],'snippets':out},ensure_ascii=False),flush=True)
          PY
