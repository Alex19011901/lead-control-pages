# rerun-marker: validate-oct13-dashboard-source-20261014
name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test Oct 13 dashboard source
        working-directory: app
        run: PYTHONPATH=.:src python -m unittest tests.test_dashboard_snapshot -v
