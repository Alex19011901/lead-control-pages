name: Diagnose pre-close record (read only)
on:
  push:
    paths:
      - '.github/workflows/diagnose-preclose-record.yml'
permissions:
  contents: read
concurrency:
  group: lead-control-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check existing messenger secrets without exposing values
        env:
          AMO_MESSENGER_TOKEN: ${{ secrets.AMO_MESSENGER_TOKEN }}
          AMO_TM_TOKEN: ${{ secrets.AMO_TM_TOKEN }}
          AMO_IO_TOKEN: ${{ secrets.AMO_IO_TOKEN }}
          AMOIO_TOKEN: ${{ secrets.AMOIO_TOKEN }}
          AMO_MESSENGER_ACCESS_TOKEN: ${{ secrets.AMO_MESSENGER_ACCESS_TOKEN }}
          AMOTM_TOKEN: ${{ secrets.AMOTM_TOKEN }}
          AMOCRM_CHAT_TOKEN: ${{ secrets.AMOCRM_CHAT_TOKEN }}
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          names = [
              'AMO_MESSENGER_TOKEN','AMO_TM_TOKEN','AMO_IO_TOKEN','AMOIO_TOKEN',
              'AMO_MESSENGER_ACCESS_TOKEN','AMOTM_TOKEN','AMOCRM_CHAT_TOKEN',
          ]
          found = []
          for name in names:
              token = os.environ.get(name) or ''
              if token:
                  found.append(name)
                  req = urllib.request.Request(
                      'https://id.amo.io/oauth2/validate',
                      headers={'Accept':'application/json','Authorization':'Bearer '+token},
                      method='GET',
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=20) as r:
                          print(json.dumps({'name':name,'present':True,'validate_http':r.status}), flush=True)
                  except urllib.error.HTTPError as e:
                      print(json.dumps({'name':name,'present':True,'validate_http':e.code}), flush=True)
                  except Exception:
                      print(json.dumps({'name':name,'present':True,'validate_http':'network_error'}), flush=True)
              else:
                  print(json.dumps({'name':name,'present':False}), flush=True)
          print(json.dumps({'found_count':len(found)}), flush=True)
          PY
