name: Diagnose phone 79165961844 once

on:
  push:
    paths:
      - ".github/workflows/diag-phone-79165961844-once.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Query amoCRM read-only by phone
        working-directory: app
        env:
          AMOCRM_TOKEN: ${{ secrets.AMOCRM_TOKEN }}
        run: |
          PYTHONPATH=src python - <<'PY'
          import json, os
          from datetime import datetime, timezone, timedelta
          import lead_control.amocrm_client as amo

          # Diagnostic must never retry a 429/HTTP failure automatically.
          amo.MAX_REQUEST_ATTEMPTS = 1
          client = amo.AmoCRMClient('https://alex1901yaru.amocrm.ru', os.environ['AMOCRM_TOKEN'].strip())
          MSK = timezone(timedelta(hours=3))

          def msk(ts):
              return datetime.fromtimestamp(int(ts), tz=timezone.utc).astimezone(MSK).isoformat() if ts else ''

          queries = ('+7 916 596-18-44', '79165961844', '89165961844', '9165961844')
          candidates = {}
          contacts_seen = {}

          for q in queries:
              try:
                  direct = client._search_collection('leads', q, with_value=None)
                  contacts = client._search_collection('contacts', q, with_value='leads')
              except RuntimeError as exc:
                  print('QUERY_ERROR', q, str(exc))
                  continue
              print('QUERY_COUNTS', q, 'leads=', len(direct), 'contacts=', len(contacts))
              for c in contacts:
                  contacts_seen[int(c['id'])] = c
              for item in client._flatten_lead_candidates(direct, contacts):
                  candidates[int(item['id'])] = item

          print('CONTACTS_BEGIN')
          for cid, c in sorted(contacts_seen.items()):
              full = client._get_entity('contacts', cid, params={'with':'leads'}) or c
              phones=[]
              for cf in full.get('custom_fields_values') or []:
                  if str(cf.get('field_code') or '').upper() == 'PHONE' or str(cf.get('field_name') or '').casefold() in {'телефон','phone'}:
                      phones.extend(str(v.get('value') or '') for v in (cf.get('values') or []))
              print(json.dumps({
                  'id': cid,
                  'name': full.get('name'),
                  'created_at_msk': msk(full.get('created_at')),
                  'updated_at_msk': msk(full.get('updated_at')),
                  'phones': phones,
                  'lead_ids': [x.get('id') for x in ((full.get('_embedded') or {}).get('leads') or [])],
              }, ensure_ascii=False))
          print('CONTACTS_END')

          rows=[]
          for lid in sorted(candidates):
              lead = client._get_entity('leads', lid) or candidates[lid]
              custom={}
              for cf in lead.get('custom_fields_values') or []:
                  label = str(cf.get('field_name') or cf.get('field_id') or '')
                  custom[label] = [v.get('value') for v in (cf.get('values') or [])]
              rows.append({
                  'id': lid,
                  'name': lead.get('name'),
                  'created_at_msk': msk(lead.get('created_at')),
                  'updated_at_msk': msk(lead.get('updated_at')),
                  'pipeline_id': lead.get('pipeline_id'),
                  'status_id': lead.get('status_id'),
                  'responsible_user_id': lead.get('responsible_user_id'),
                  'custom_fields': custom,
              })
          print('LEADS_JSON_BEGIN')
          print(json.dumps(rows, ensure_ascii=False, indent=2))
          print('LEADS_JSON_END')
          PY
