name: Price Control Manual Refresh

on:
  push:
    paths:
      - ".github/workflows/price-control-public.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: price-control-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium

      - name: Restore DocsInBox session and price
        env:
          DXBX_STORAGE_STATE: ${{ secrets.DXBX_STORAGE_STATE }}
        run: |
          test -n "$DXBX_STORAGE_STATE" || { echo "DXBX_STORAGE_STATE is not configured"; exit 1; }
          printf '%s' "$DXBX_STORAGE_STATE" > price-control/dxbx-storage-state.json
          cat price-control/price_20260826.parts/* > /tmp/price_20260826.json.gz.b64
          base64 --decode /tmp/price_20260826.json.gz.b64 | gzip -dc > price-control/price_20260826.json
          python - <<'PY'
          import json
          p='price-control/price_20260826.json'
          d=json.load(open(p,encoding='utf-8'))
          assert d.get('valid_on') == '2026-08-26'
          assert len(d.get('rows',[])) == 2170
          print('Price payload OK:', len(d['rows']), 'rows')
          PY

      - name: Refresh DocsInBox data
        env:
          DOCSINBOX_STORAGE_STATE: price-control/dxbx-storage-state.json
        run: |
          node price-control/refresh_dxbx.js /tmp/price-control-formula-test.json
          node - <<'NODE'
          const fs = require('fs');
          const d = JSON.parse(fs.readFileSync('/tmp/price-control-formula-test.json','utf8'));
          const rows = d.week.rowsData || [];
          const inv31153 = rows.filter(r => r[2] === 'ПЭ-31153' && r[9] === 'ABOVE')
            .reduce((s,r) => s + Number(r[8] || 0), 0);
          console.log('FORMULA_TEST', JSON.stringify({
            docs:d.week.docs,
            rows:d.week.rows,
            above:d.week.above,
            below:d.week.below,
            unmatched:d.week.unmatched,
            overpay:d.week.overpay,
            pe31153Overpay:Math.round((inv31153 + Number.EPSILON)*100)/100
          }));
          NODE

      - name: Save refreshed data
        run: |
          rm -f price-control/dxbx-storage-state.json price-control/price_20260826.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price-control/current.json
          if git diff --cached --quiet; then
            echo "No data changes"
          else
            git commit -m "Refresh Price Control data"
            git push origin main
          fi
