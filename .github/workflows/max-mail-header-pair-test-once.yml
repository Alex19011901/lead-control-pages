name: MAX Mail Header Pair Test Once 2

on:
  push:
    paths:
      - ".github/workflows/max-mail-header-pair-test-once.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MAX mail header pair regression test
        working-directory: app
        run: |
          PYTHONPATH=src python -m unittest             tests.test_max_mail_historical_pair.HistoricalPairTests.test_mail_header_pairs_next_image_and_builds_lead
