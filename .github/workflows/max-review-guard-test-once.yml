name: MAX Review Guard Test Once

on:
  push:
    paths:
      - ".github/workflows/max-review-guard-test-once.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run MAX review guard regression test
        working-directory: app
        run: |
          PYTHONPATH=src python -m unittest             tests.test_max_leads_parser.MaxLeadClassifierTests.test_lead_with_service_phrase_goes_to_review_not_ignore
