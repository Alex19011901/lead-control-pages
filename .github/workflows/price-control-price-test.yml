name: Price Control Price Payload Test

on:
  push:
    paths:
      - ".github/workflows/price-control-price-test.yml"

permissions:
  contents: read

jobs:
  validate-price:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate 26 Aug price payload
        run: |
          cat price-control/price_20260826.parts/* > /tmp/price_20260826.json.gz.b64
          base64 --decode /tmp/price_20260826.json.gz.b64 | gzip -dc > /tmp/price_20260826.json
          python - <<'PY'
          import json
          d=json.load(open('/tmp/price_20260826.json',encoding='utf-8'))
          assert d.get('valid_on') == '2026-08-26', d.get('valid_on')
          rows=d.get('rows',[])
          assert len(rows) == 2170, len(rows)
          lookup={(r['name'],r['unit']):float(r['price']) for r in rows}
          checks={
            ('Базилик зеленый Стандарт','кг'):1537.19,
            ('Апельсины для сока Стандарт','кг'):182.45,
            ('Авокадо Хаас Стандарт','кг'):922.31,
            ('Морковь мытая Стандарт','кг'):91.13,
          }
          for k,v in checks.items():
            assert lookup.get(k) == v, (k,lookup.get(k),v)
          print('PRICE_PAYLOAD_OK', len(rows))
          PY
