name: One-off Metrika ClientID Hits Check 2026-09-08

on:
  push:
    paths:
      - ".github/workflows/metrika-clientid-hits-check-20260908.yml"

permissions:
  contents: read

concurrency:
  group: metrika-clientid-hits-check-20260908
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify read-only client allow-list
        working-directory: app
        run: PYTHONPATH=. python -m unittest tests.test_metrika_logs_readonly -v

      - name: Check minimal hits for exact ClientID and visit
        working-directory: app
        env:
          YANDEX_METRIKA_READ_TOKEN: ${{ secrets.YANDEX_METRIKA_READ_TOKEN }}
        run: |
          PYTHONPATH=. python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import re
          import time
          import urllib.parse

          from scripts.metrika_logs_readonly import LogsApiError, MetrikaLogsReadOnlyClient, parse_tsv

          COUNTER_ID = 52597240
          DATE1 = "2026-09-08"
          DATE2 = "2026-09-08"
          ATTRIBUTION = "AUTOMATIC"
          TARGET_CLIENT_ID_SHA256 = "9394a52a99bc1fe36f345bc0f1e6ef0d0efbf681bf1d15f3795cbf6b42c570da"
          TARGET_VISIT_ID_SHA256 = "218c12a011ed3292a373eb1b5262462ec509b3686e1d469a6ab3932f93dd2b75"
          TERMINAL_FAILURES = {
              "canceled",
              "cleaned_by_user",
              "cleaned_automatically_as_too_old",
              "processing_failed",
          }
          FIELDS = (
              "ym:pv:visitID",
              "ym:pv:dateTime",
              "ym:pv:clientID",
              "ym:pv:URL",
              "ym:pv:referer",
              "ym:pv:from",
              "ym:pv:lastTrafficSource",
              "ym:pv:lastAdvEngine",
              "ym:pv:params",
          )
          MARKERS = ("yclid", "utm_source", "utm_medium", "utm_campaign", "yandex", "direct", "gclid")

          def clean(value: object) -> str:
              return str(value or "").strip()

          def sha(value: object) -> str:
              return hashlib.sha256(clean(value).encode("utf-8")).hexdigest()

          def safe_url(value: object) -> dict[str, object]:
              text = clean(value)
              if not text:
                  return {"host": "", "path": "", "query_keys": [], "has_yclid": False}
              try:
                  parsed = urllib.parse.urlsplit(text)
                  pairs = urllib.parse.parse_qsl(parsed.query, keep_blank_values=True)
                  keys = []
                  for key, _ in pairs:
                      key = str(key)
                      if key not in keys:
                          keys.append(key)
                  return {
                      "host": parsed.hostname or "",
                      "path": parsed.path or "/",
                      "query_keys": keys,
                      "has_yclid": any(key.lower() == "yclid" for key in keys),
                  }
              except Exception:
                  return {"host": "", "path": "", "query_keys": [], "has_yclid": False}

          def marker_presence(row: dict[str, str]) -> dict[str, bool]:
              haystack = "\n".join([
                  clean(row.get("ym:pv:URL")),
                  clean(row.get("ym:pv:referer")),
                  clean(row.get("ym:pv:params")),
                  clean(row.get("ym:pv:from")),
                  clean(row.get("ym:pv:lastAdvEngine")),
              ]).lower()
              return {marker: marker in haystack for marker in MARKERS}

          def safe_reason(exc: Exception) -> str:
              value = f"{type(exc).__name__}:{exc}".replace("\n", " ").replace("\r", " ")
              value = re.sub(r"(OAuth|Bearer)\s+[A-Za-z0-9._~+/=-]+", r"\1 [redacted]", value)
              return value[:240]

          token = os.environ.get("YANDEX_METRIKA_READ_TOKEN", "").strip()
          if not token:
              print(json.dumps({"status": "blocked", "reason": "missing_read_token"}, sort_keys=True))
              raise SystemExit(2)

          client = MetrikaLogsReadOnlyClient(token, counter_id=COUNTER_ID)
          try:
              client.evaluate(date1=DATE1, date2=DATE2, fields=FIELDS, attribution=ATTRIBUTION, source="hits")
              request = client.create_export(date1=DATE1, date2=DATE2, fields=FIELDS, attribution=ATTRIBUTION, source="hits")
              current = request
              for poll_number in range(201):
                  if current.status == "processed":
                      break
                  if current.status in TERMINAL_FAILURES:
                      raise LogsApiError(f"log_request_{current.status}")
                  if poll_number == 200:
                      raise LogsApiError("log_request_timeout")
                  time.sleep(3)
                  current = client.status(request.request_id)

              rows: list[dict[str, str]] = []
              for part_number in current.parts:
                  rows.extend(parse_tsv(client.download_part(current.request_id, part_number)))
          except Exception as exc:
              print(json.dumps({"status": "error", "reason": safe_reason(exc)}, sort_keys=True))
              raise SystemExit(1)

          client_rows = [row for row in rows if sha(row.get("ym:pv:clientID")) == TARGET_CLIENT_ID_SHA256]
          visit_rows = [row for row in client_rows if sha(row.get("ym:pv:visitID")) == TARGET_VISIT_ID_SHA256]

          safe_hits = []
          for row in visit_rows:
              safe_hits.append({
                  "date_time_counter": clean(row.get("ym:pv:dateTime")),
                  "url": safe_url(row.get("ym:pv:URL")),
                  "referer": safe_url(row.get("ym:pv:referer")),
                  "from": clean(row.get("ym:pv:from")),
                  "traffic_source": clean(row.get("ym:pv:lastTrafficSource")),
                  "adv_engine": clean(row.get("ym:pv:lastAdvEngine")),
                  "markers": marker_presence(row),
                  "params_nonempty": bool(clean(row.get("ym:pv:params"))),
              })

          result = {
              "status": "found" if visit_rows else "not_found",
              "operation": "read_export_only",
              "source": "hits",
              "counter_id": COUNTER_ID,
              "date1": DATE1,
              "date2": DATE2,
              "attribution": ATTRIBUTION,
              "fields_total": len(FIELDS),
              "rows_total": len(rows),
              "target_client_hits_total": len(client_rows),
              "target_visit_hits_total": len(visit_rows),
              "request_id": current.request_id,
              "hits_truncated": len(safe_hits) > 50,
              "hits": safe_hits[:50],
          }
          print(json.dumps(result, ensure_ascii=False, sort_keys=True))
          raise SystemExit(0 if visit_rows else 3)
          PY
