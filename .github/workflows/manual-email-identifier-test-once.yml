name: Manual Email Identifier Test Once

on:
  push:
    paths:
      - ".github/workflows/manual-email-identifier-test-once.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run email identifier test
        working-directory: app
        run: |
          PYTHONPATH=src python -m unittest             tests.test_manual_review_fields.ManualReviewFieldsTests.test_confirmed_email_becomes_crm_identifier
