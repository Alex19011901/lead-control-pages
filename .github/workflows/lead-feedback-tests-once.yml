name: Lead Feedback Tests Once

on:
  push:
    paths:
      - ".github/workflows/lead-feedback-tests-once.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run feedback tests
        working-directory: app
        run: PYTHONPATH=src python -m unittest tests.test_crm_feedback
